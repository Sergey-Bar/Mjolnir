documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "README*.md"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

rules:
  - changed-files:
      - any-glob-to-any-file: "src/rules/**"

website:
  - changed-files:
      - any-glob-to-any-file: "site/**"

scripts:
  - changed-files:
      - any-glob-to-any-file: "scripts/**"

brand:
  - changed-files:
      - any-glob-to-any-file:
          - "src/brand/**"
          - "assets/brand/**"
          - "assets/readme/**"
