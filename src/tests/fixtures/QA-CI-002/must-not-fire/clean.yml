name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm run lint

  teardown:
    runs-on: ubuntu-latest
    steps:
      - run: docker compose down || true
      - run: pkill -f dev-server || true
      - run: rm -rf tmp || true
