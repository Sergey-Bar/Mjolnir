name: Release checks

on: [push]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test; npm run lint

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pytest; make lint

  vitest-tee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: vitest run | tee vitest.log
