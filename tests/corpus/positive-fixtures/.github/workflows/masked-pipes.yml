name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test | tee test-results.log

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: yarn test | tee integration.log

  paged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test | tee out.txt
