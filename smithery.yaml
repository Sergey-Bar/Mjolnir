{
  "$schema": "https://smithery.ai/server.config.schema.json",
  "name": "mjolnir-qa",
  "displayName": "Mjölnir — verification trust scan",
  "description": "Scans test suites, Playwright configs and CI workflows, grades the verification system (not the product code), and publishes a measured false-positive rate per rule. MCP tools: scan, explain, diff.",
  "version": "1.0.0",
  "server":
    {
      "type": "stdio",
      "command": { "type": "npx", "args": ["-y", "mjolnir-qa@latest", "mcp"] },
    },
  "repository": "https://github.com/Sergey-Bar/Mjolnir",
  "license": "MIT",
  "keywords":
    ["testing", "qa", "ci", "playwright", "mcp", "model-context-protocol"],
}
