# SonarQube configuration.
#
# 6.0. The repository already runs typescript-eslint (with `security` and
# `regexp` plugins), CodeQL, OSV-Scanner, Scorecard and a coverage ratchet, so
# this file is NOT a re-listing of those. It exists to describe the two things
# Sonar needs to be told and cannot infer:
#
#   1. which paths are DATA rather than source - the fixture corpora
#      deliberately contain the anti-patterns the rules detect, so Sonar
#      counting them as duplicated code or as a coverage gap is measuring the
#      exhibits rather than the product;
#   2. the thresholds this repository actually holds itself to, which are the
#      ones `certify` enforces.
#
# ONE declaration per key. The first draft of this file declared
# `sonar.exclusions` twice and `sonar.coverage.exclusions` twice; a properties
# file takes the LAST value, so the first block of each was dead text that
# read as configuration. That is the same shape as the defects this release
# has been removing - an artefact asserting something the consumer ignores -
# and it was caught by grepping for the keys rather than by reading.

sonar.projectKey=sergey-bar_mjolnir
# ASCII on purpose. Sonar reads a properties file as ISO-8859-1 unless told
# otherwise, and a display name is not worth an encoding negotiation.
sonar.projectName=Mjolnir
sonar.organization=sergey-bar
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Build output, vendored trees, agent/machine-local state, and the generated
# artifact `src/rules/measured-fp.generated.ts` - the last of which is
# drift-locked by the `generated-docs-drift` job, so Sonar reporting on it is
# a second opinion on a file a generator owns.
sonar.exclusions=\
  dist/**,\
  coverage/**,\
  node_modules/**,\
  package/**,\
  .mjolnir/**,\
  .kilo/**,\
  .claude/**,\
  .opencode/**,\
  examples/**,\
  site/**,\
  scratch/**,\
  docs/archive/**,\
  brags-scan/**,\
  graphify-out/**,\
  src/rules/measured-fp.generated.ts

# DATA, not source. Real OSS code and hand-written defect exhibits that must
# never be held to the linter - they contain the anti-patterns the rules
# detect by design. The same set `eslint.config.js` ignores, for the same
# reason, and `tests/corpus/verdicts/**` is here too: it is immutable
# evidence, and a coverage requirement over it would be a requirement to keep
# re-litigating a verdict.
#
# The authoritative exemption list for the SHIPPED code is
# `docs/COVERAGE-EXEMPTIONS.json`, validated by its own gate. A path
# exempted there and absent here is a gap Sonar will report and the ratchet
# already accepts.
sonar.coverage.exclusions=\
  tests/fixtures/**,\
  tests/golden/repo/**,\
  tests/corpus/positive-fixtures/**,\
  tests/corpus/negative-fixtures/**,\
  tests/corpus/verdicts/**,\
  tests/corpus/.cache*/**,\
  tests/coverage/**

# Duplicated code. The adapter modules and the rule families are genuinely
# parallel by design - one module per language, one per family - so CPD over
# them reports structure as a smell. 10 is where the remaining hits are worth
# a human read; the default 4 is below this repository's actual rate and
# reports the same boilerplate in every adapter.
sonar.cpd.exclusions=\
  src/adapters/*.ts,\
  src/rules/families/*.ts,\
  src/verb-registry.ts
sonar.cpd.threshold=10

# Complexity. The longest functions in the tree are the two SVG builders
# (611 and 479 lines) and they are the honest target for this number rather
# than a wish: each is a linear generator with no branching worth splitting,
# so a ceiling that flagged them would push toward churn rather than
# clarity. These are the numbers `tests/cli/category-consistency.spec.ts` and
# the coverage ratchet already hold the tree to.
sonar.cognitive.complexity.threshold=15
sonar.cyclomatic.complexity.threshold=15

# Specs are held to the same standard on bugs and vulnerabilities and to
# nothing on style: a test is allowed to be long, repetitive, and named
# `handler2` without any of that being worth a comment.
sonar.tests=tests/**
sonar.test.inclusions=tests/**/*.spec.ts
