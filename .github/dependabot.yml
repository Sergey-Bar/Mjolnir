# Dependabot is the single automated dependency-update channel (the Renovate
# stub was removed — running both would double the update PRs).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "automated"
    assignees: []
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      production-dependencies-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      types-and-linters-minor-patch:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "typescript-eslint*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "development"
        dependency-name: "@types/*"
        update-type: "version-update:semver-major"
      - dependency-type: "development"
        dependency-name: "eslint*"
        update-type: "version-update:semver-major"
      - dependency-type: "development"
        dependency-name: "prettier*"
        update-type: "version-update:semver-major"
    ignore:
      # web-tree-sitter 0.25.6 -> 0.26.x: the 0.26 runtime cannot load the
      # tree-sitter-wasms grammar WASMs at all (Language.load() throws in
      # getDylinkMetadata; verified by reproduction — see the DEPENDENCY PIN
      # header in src/engine/tree-sitter-ast.ts). tree-sitter-wasms' latest
      # release (0.1.13) predates the 0.26 ABI and ships no compatible
      # grammars. Re-enable when tree-sitter-wasms ships 0.26-built grammars.
      - dependency-name: "web-tree-sitter"
      # typescript 6 -> 7: typescript@7 is the native (Go) compiler with NO
      # JS API (no `main`, no `types` in the package) — ts-morph, which
      # powers the entire AST precision layer, cannot bind to it; and
      # typescript-eslint@8.69.0 (latest) still peers <6.1.0. Re-enable when
      # BOTH typescript-eslint peers >=7 and ts-morph ships a 7-compatible
      # API adapter.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "automated"
    assignees: []
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin critical actions to a major line — test before allowing majors.
      - dependency-name: "actions/checkout"
        versions: [">=5"]
      - dependency-name: "actions/setup-node"
        versions: [">=4"]
      - dependency-name: "actions/cache"
        versions: [">=4"]
