# Dependabot is the single automated dependency-update channel (the Renovate
# stub was removed — running both would double the update PRs).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # PR channel policy: only majors reach a PR. Minor and patch bumps are
    # absorbed silently during routine work, so the upgrade log stays a list
    # of breaking changes instead of a rolling wall of PRs. Loosen this when
    # the repo actually wants the small bumps surfaced automatically.
    # Note: Dependabot security updates are configured separately and are NOT
    # suppressed by this list.
    ignore:
      - update-types:
          - "minor"
          - "patch"
      # web-tree-sitter 0.25.6 -> 0.26.x: the 0.26 runtime cannot load the
      # tree-sitter-wasms grammar WASMs at all (Language.load() throws in
      # getDylinkMetadata; verified by reproduction — see the DEPENDENCY PIN
      # header in src/engine/tree-sitter-ast.ts). tree-sitter-wasms' latest
      # release (0.1.13) predates the 0.26 ABI and ships no compatible
      # grammars. Re-enable when tree-sitter-wasms ships 0.26-built grammars.
      - dependency-name: "web-tree-sitter"
      # typescript 6 -> 7: typescript@7 is the native (Go) compiler with NO
      # JS API (no `main`, no `types` in the package) — ts-morph, which
      # powers the entire AST precision layer, cannot bind to it; and
      # typescript-eslint@8.69.0 (latest) still peers <6.1.0. Re-enable when
      # BOTH typescript-eslint peers >=7 and ts-morph ships a 7-compatible
      # API adapter.
      - dependency-name: "typescript"
        versions: [">=7"]

  # Actions are SHA-pinned, so a Dependabot commit is already a tight diff; the
  # only thing worth cutting is the count. Minor/patch bumps are skipped, and
  # every remaining major lands in ONE PR: the action majors are not
  # independent (checkout/setup-node/upload-artifact move together on the Node
  # runtime), so they have to be reviewed as a set rather than one at a time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-major:
        patterns:
          - "*"
    ignore:
      - update-types:
          - "minor"
          - "patch"
