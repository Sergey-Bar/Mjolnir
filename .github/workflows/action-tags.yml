name: Stable v3 Action Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  move-current-major:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stable-action-tags
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move stable v3 action tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          if [[ "$MAJOR" != "3" ]]; then
            echo "No action tag update for v$MAJOR; the current action major is v3."
            exit 0
          fi
          MAJOR_TAG="v$MAJOR"
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force
