name: Stable Action Major Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  move-current-major:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stable-action-tags
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the action major tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          # The major tag follows the release. It was hardcoded to 3, which
          # meant no v4 or v5 could ever be published and the docs' recommended
          # `uses: Sergey-Bar/Mjolnir@vN` had no ref to resolve to. Deriving it
          # from the tag being pushed is the only rule that stays true as the
          # majors move.
          MAJOR_TAG="v$MAJOR"
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force
          echo "moved $MAJOR_TAG to $GITHUB_SHA"
