name: Scorecard supply-chain security

# OpenSSF Scorecard: measures the repo's own supply-chain posture
# (branch protection, pinned actions, dependency update tooling, code
# review) against the same practices this repo enforces on the projects
# it scans. Publishes a public 0-10 score and badge, and a durable SARIF
# record in the Security tab — distinct from sarif-code-scanning.yml,
# which is QA Doctor's own self-scan of this codebase, not a supply-chain
# score.

on:
  branch_protection_rule:
  schedule:
    # Monday 06:00 UTC — after the SARIF self-scan's 05:17 slot.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level (audit S-3/S-10, matches ci.yml): no
# job in this workflow needs write access by default. Each job escalates
# for itself in its own permissions block below.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Publishing the score to api.securityscorecards.dev.
      id-token: write
      # Uploading the SARIF result to the Security tab.
      security-events: write
      # actions/upload-artifact.
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF result as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
