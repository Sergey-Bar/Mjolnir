name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level (audit S-3/S-10): no job in this
# workflow needs write access to anything.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tsdown requires ^22.18.0 || >=24.11.0 — Node 20 cannot build.
        node: [22]
    runs-on: ${{ matrix.os }}
    # Audit S-7: a hung npm ci or scan must not sit for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Coverage thresholds are enforced in CI, not just locally. Their
      # absence here is why coverage silently fell from ~96% to 92.6%
      # between releases. Run on one OS only — the thresholds are
      # platform-independent and this keeps the 3-OS matrix fast.
      - run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest'
      - run: npm audit --audit-level=high

  # Self-scan gate (§30.2 #7) — activates once rules exist.
  self-scan:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.mjs . --json > self-scan.json
      - name: Fail on new errors in own repo
        run: node -e "const r=require('./self-scan.json');const errs=r.findings.filter(f=>f.severity==='error');if(errs.length){console.error('Self-scan errors:',errs);process.exit(1)}"
      - name: Generate badge artifact (Master-Stabilization-Plan Sprint 2 Task 11)
        continue-on-error: true
        run: node dist/cli.mjs badge .
      - name: Upload self-scan result as a build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-scan-result
          path: |
            self-scan.json
            mjolnir-badge.json
          retention-days: 90
