name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level (audit S-3/S-10): no job in this
# workflow needs write access to anything. Declared here so a new job
# cannot silently inherit the repository default.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tsdown requires ^22.18.0 || >=24.11.0 — Node 20 cannot build.
        # Bug-audit G7: node 24 is the current LTS and inside the engines
        # claim — one ubuntu canary keeps the >=22.18 promise honest
        # without tripling the matrix.
        node: [22, 24]
        exclude:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    # Audit S-7: a hung npm ci or scan must not sit for the 6-hour default.
    timeout-minutes: 20
    # M3: per-job wall-clock minutes go into the job summary. Soft
    # budget = the timeout minus a 5-minute headroom band; exceeding it
    # prints a summary warning (never gates — M3 hardens this into a
    # gate only after two weeks of measured data, floors-from-observation).
    env:
      TIME_BUDGET_MINUTES: 15
    steps:
      # M3: capture the job start for the soft time-budget summary below.
      - run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The brand gate. Every colour, typeface and badge in the tree is
      # checked against src/brand/tokens.ts, and every declared
      # foreground/background pairing has its WCAG contrast computed.
      # Blocking, for the reason site:doctor is blocking in pages.yml: a
      # brand that is only enforced by review drifts back the moment
      # nobody is looking, which is how six copies of one palette
      # happened.
      - run: npm run brand:doctor
      # And the gate is proven able to fail before it is trusted: each
      # rule is seeded with a deliberate violation, observed rejecting
      # it, and the file restored. A check never seen to fail is not
      # evidence.
      - run: npm run brand:doctor:selftest
      # The vendored webfonts are what ships; this re-verifies the
      # committed bytes against their sha256 manifest, offline. The build
      # itself never fetches a font — the site used to pull Cinzel and
      # Inter from a third party at runtime, on the page whose whole
      # argument is that you should not trust what you have not verified.
      - run: npm run brand:fonts:check
      - run: npm test
      # Fixture integrity, non-TS tier (certification-audit Phase 2.4):
      # Python fixtures are real code the detectors consume as text —
      # a syntax error in one must not pass silently. Syntax-tier only
      # (the bytecode artifact is throwaway). Java/C# fixtures have no
      # reliable syntax-check toolchain on all runners; documented INFO
      # (their structural layer stays covered by the fixture firewall
      # + harness oracle).
      - name: Python fixture syntax tier (compileall)
        if: runner.os == 'Linux'
        env:
          # Bytecode must NOT land in the fixture trees: __pycache__ dirs
          # are non-hidden entries the fixture-harness/docs-generator read
          # as fixture files, which would silence the QA-PY rules in every
          # later step (the ubuntu-only coverage run caught exactly that).
          PYTHONPYCACHEPREFIX: /tmp/mjolnir-pycache
        run: |
          if find tests/fixtures tests/corpus/positive-fixtures -name "*.py" | grep -q .; then
            python3 -m compileall -q tests/fixtures tests/corpus/positive-fixtures
          else
            echo "no Python fixtures present — nothing to compile"
          fi
      # Bug-audit G11: moderate advisories are ignored at `high` — a
      # steady drip of moderate-severity vulns is how a real supply-chain
      # issue goes unnoticed between high ones.
      # M3: retry-once for registry 503s (infra flake class, commit
      # e4f4b98: windows npm audit hit a registry 503 with all 5118
      # tests passing). The first attempt is soft; the retry gates —
      # two consecutive registry failures still fail the job — and any
      # retry is recorded in the summary so the flake rate stays
      # visible.
      - name: npm audit (first attempt)
        id: audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: npm audit (retry once)
        if: steps.audit.outcome == 'failure'
        env:
          AUDIT_FIRST_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if npm audit --audit-level=moderate; then
            echo "npm audit: first attempt failed, retry passed (registry flake?)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm audit: first attempt AND retry failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Record audit result in job summary
        if: steps.audit.outcome == 'success'
        run: >
          echo "npm audit: first attempt ok" >> "$GITHUB_STEP_SUMMARY"
      # Bug-audit G6: headroom must be measurable — the four percentages
      # go into the job summary (and coverage/ is uploaded below) so the
      # ratchet floors can be re-raised against measured numbers. Runs
      # vitest with --coverage directly so the coverage run is visible
      # as such (QA-CI-005 verifies this pairing on every self-scan).
      - name: Run coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        # --no-file-parallelism: single-worker coverage merge (the
        # cross-worker v8 merge under-attributes branches for files
        # loaded by several workers); generous timeouts because the
        # instrumented run slows git- and child-process-heavy specs.
        # scale-benchmark stays IN: its in-process 3k-file runScan is a
        # major coverage contributor and its own per-test timeouts
        # already give it real headroom.
        run: >-
          npx vitest run --coverage --no-file-parallelism
          --testTimeout=120000 --hookTimeout=120000
      - name: Report coverage floors in the job summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const t = s.total;
          const line = "Statements " + t.statements.pct + "% · Branches " + t.branches.pct + "% · Functions " + t.functions.pct + "% · Lines " + t.lines.pct + "%";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Coverage floors\n" + line + "\n");
          console.log(line);
          '
      - name: Upload coverage report as a build artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Job time budget in summary (soft)
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const started = new Date(Number(process.env.JOB_START_EPOCH) * 1000);
          const minutes = Math.round(((Date.now() - started.getTime()) / 60000) * 10) / 10;
          const budget = Number(process.env.TIME_BUDGET_MINUTES);
          let line = "Job wall-clock: " + minutes + " min (soft budget " + budget + " min)";
          if (minutes > budget) line += " — OVER BUDGET (warning; hard gate only after 2 weeks of measured data, M3)";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '

  # Workflow-lint coverage (Beta-to-Stable M4): actionlint, version-pinned
  # so its ruleset is part of the audited supply chain like every other
  # pinned action in this repo. The tarball is downloaded from the pinned
  # release tag and verified against that release's own checksums file
  # before extraction — no curl|bash of mutable script bodies.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: v1.7.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          # Keep the distribution filename: sha256sum -c matches the name
          # recorded in the checksums manifest, so a renamed download
          # would silently check nothing (first run failed exactly here).
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo checksums.txt "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_checksums.txt"
          grep "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" actionlint
      - name: actionlint (all repo workflows)
        run: ./actionlint -color

  # Self-scan gate (§30.2 #7) — activates once rules exist.
  self-scan:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIME_BUDGET_MINUTES: 7
    steps:
      # M3: capture the job start for the soft time-budget summary below.
      - run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.mjs . --json > self-scan.json
      # Self-scan annotations (plan M4): inline findings on the run page
      # via the same single emitter the generated workflow uses.
      - name: Self-scan annotations
        if: always()
        run: node dist/cli.mjs summary self-scan.json
      # Bug-audit G8 (self-scan honesty gate): the old gate blocked only on
      # error-severity findings — a TRUNCATED self-scan (partial: true) or
      # one where rules crashed silently passed. A truncated self-scan of
      # this tool's own repo is a pipeline bug, not a green run.
      - name: Self-scan honesty gate
        run: |
          node -e "const r=require('./self-scan.json');if(r.partial===true){console.error('Self-scan was PARTIAL — a truncated scan must not pass the gate.');process.exit(1)}if((r.analysisStatus&&r.analysisStatus.rulesCrashed||0)>0){console.error('Self-scan had',r.analysisStatus.rulesCrashed,'rule crash(es) — crash isolation must never hide from the dogfood gate.');process.exit(1)}const errs=r.findings.filter(f=>f.severity==='error');if(errs.length){console.error('Self-scan errors:',errs);process.exit(1)}const warns=r.findings.filter(f=>f.severity==='warning');if(warns.length){console.log(warns.length+' warning(s) — non-blocking, see the uploaded artifact.')}"
      - name: Add warning count to the job summary (non-blocking)
        if: always()
        run: |
          node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('self-scan.json','utf8'));const n=r.findings.filter(f=>f.severity==='warning').length;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Self-scan warnings (non-blocking) - '+n+'\n')}catch(e){}"
      - name: Generate badge artifact (Master-Stabilization-Plan Sprint 2 Task 11)
        continue-on-error: true
        run: node dist/cli.mjs badge .
      - name: Upload self-scan result as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-scan-result
          path: |
            self-scan.json
            mjolnir-badge.json
          retention-days: 90
      - name: Job time budget in summary (soft)
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const started = new Date(Number(process.env.JOB_START_EPOCH) * 1000);
          const minutes = Math.round(((Date.now() - started.getTime()) / 60000) * 10) / 10;
          const budget = Number(process.env.TIME_BUDGET_MINUTES);
          let line = "Job wall-clock: " + minutes + " min (soft budget " + budget + " min)";
          if (minutes > budget) line += " — OVER BUDGET (warning; hard gate only after 2 weeks of measured data, M3)";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '

  # Certification gate (certification-audit Phase 5.5, G2/G5): the doctor
  # self-audit runs on the BUILT artifact and gates the pipeline — exit 0
  # requires every check pass (a fail OR an INCONCLUSIVE check exits 1).
  # The JSON report is the evidence artifact; determinism is re-proven by
  # running the command twice and diffing (G5 self-verify).
  certification:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # WI-12A: keep the gate honest on main too — every CI run validates
      # the CURRENT version's CHANGELOG section (cheap; the release flow
      # re-runs it release-blocking with --rules-touched semantics).
      - name: CHANGELOG integrity gate (WI-12A)
        run: npx tsx scripts/check-changelog.ts --expect-version "$(node -p "require('./package.json').version")"
      # WI-10 (plan §14): reporter version-sync gate — ADVISORY while the
      # reporter line is unpublished; becomes blocking after three green
      # release cycles. The hard-drift case (reporter AHEAD of the root
      # package; ingestion-contract break) exits 1 even in advisory mode.
      - name: Reporter version-sync gate (advisory)
        run: npx tsx scripts/check-reporter-version.ts
      - name: Doctor self-audit gate (exit 0 = all checks pass)
        run: node dist/cli.mjs doctor . --json > doctor-report.json
      - name: G5 determinism self-verify (second run must be byte-identical)
        run: |
          node dist/cli.mjs doctor . --json > /tmp/doctor-report-2.json
          if diff doctor-report.json /tmp/doctor-report-2.json; then
            echo "doctor --json: byte-identical across runs ✓"
          else
            echo "doctor --json output is NOT deterministic — G5 violated"
            exit 1
          fi
      - name: F2 scan-artifact determinism (two scans byte-identical minus durationMs allowlist)
        run: node scripts/scan-determinism-replay.mjs .
      - name: Sanity-check the report contract in the summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("doctor-report.json", "utf8"));
          if (r.schema !== "mjolnir.doctor-report@1") { console.error("unknown schema", r.schema); process.exit(1); }
          const verdict = r.healthy ? "WORTHY" : "VIOLATIONS";
          const line = "doctor: " + r.summary.pass + " pass · " + r.summary.fail + " fail · " + r.summary.inconclusive + " inconclusive → " + verdict;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          console.log(line);
          '
      - name: Upload doctor report as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doctor-report
          path: doctor-report.json
          retention-days: 90

  # Detector revision integrity, check C (certification-audit Phase 3.4,
  # G4/D17): a WARN-level review visibility step — a detector whose source
  # identity changed without a declared revision bump gets a ::warning::
  # annotation asking for a behavior-neutrality statement or a bump. Never
  # a hard fail: a hard fail would manufacture the routine-bump culture
  # G4 prohibits. The blocking invariants (manifest ↔ source ↔ registry)
  # are owned by the doctor's revision-integrity check inside npm test.
  detector-revision-diff:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diff detector-hashes manifest against base branch
        run: |
          BASE="$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD)"
          git show "${BASE}:tests/corpus/detector-hashes.json" > /tmp/detector-hashes-base.json \
            || echo "no base manifest (first landing)"
          if [ -s /tmp/detector-hashes-base.json ]; then
            npx tsx scripts/diff-detector-hashes.ts /tmp/detector-hashes-base.json
          else
            echo "INFO: no detector-hashes manifest on the base branch (first landing) — nothing to diff."
          fi

  # Bug-audit B4.31 (generated-docs drift gate): docs/rules pages, the
  # COUNT-LOCK FP-audit table and the golden lock are GENERATED artifacts.
  # If a rule change lands without re-running its generator, the committed
  # docs silently drift from what the code actually does. This job
  # regenerates everything and fails on any diff (same pattern as the
  # hero-asset reproducibility test).
  generated-docs-drift:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIME_BUDGET_MINUTES: 10
    steps:
      # M3: capture the job start for the soft time-budget summary below.
      - run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate docs, COUNT-LOCK table and golden lock
        run: |
          npm run docs:rules
          npm run fp-audit:generate
          npm run docs:capability
          npm run docs:counts
          npm run docs:machine-contract
          npm run brand:tokens
          npm run golden:update
          npm run docs:hero
          npm run docs:demo
          npm run detector-hashes:update
      - name: Fail when committed artifacts differ from regenerated ones
        run: |
          git diff --exit-code
          # `git diff` cannot see UNTRACKED generated files (e.g. the
          # docs/rules page of a newly added rule) — those would ship
          # silently. Fail on any unexpected generated output too.
          untracked="$(git ls-files --others --exclude-standard docs/rules docs/COUNT-LOCK.md docs/FP-AUDIT.md docs/RULE-CAPABILITY-MATRIX.md docs/RULE-CAPABILITY-MATRIX.json tests/golden assets/readme)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated artifacts — commit them:"
            echo "$untracked"
            exit 1
          fi
      # F3 (certification-audit remediation): agent instruction surfaces
      # are version-stamped generated content the regen step above never
      # touched — the v0.5.15-stamp drift shipped silently through this
      # job. planInstall is deterministic (version-pinned, no timestamps),
      # so re-planning here and failing on any mismatch closes the hole.
      - name: Managed-surface stamp gate (agent surfaces match the install plan)
        run: npx tsx scripts/check-managed-surfaces.mjs .
      - name: Job time budget in summary (soft)
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const started = new Date(Number(process.env.JOB_START_EPOCH) * 1000);
          const minutes = Math.round(((Date.now() - started.getTime()) / 60000) * 10) / 10;
          const budget = Number(process.env.TIME_BUDGET_MINUTES);
          let line = "Job wall-clock: " + minutes + " min (soft budget " + budget + " min)";
          if (minutes > budget) line += " — OVER BUDGET (warning; hard gate only after 2 weeks of measured data, M3)";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '
