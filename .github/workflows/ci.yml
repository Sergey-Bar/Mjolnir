name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level (audit S-3/S-10): no job in this
# workflow needs write access to anything. Declared here so a new job
# cannot silently inherit the repository default.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tsdown requires ^22.18.0 || >=24.11.0 — Node 20 cannot build.
        # Bug-audit G7: node 24 is the current LTS and inside the engines
        # claim — one ubuntu canary keeps the >=22.18 promise honest
        # without tripling the matrix.
        node: [22, 24]
        exclude:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Audit S-7: a hung npm ci or scan must not sit for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A merge that hit a conflict in package-lock.json and was
        # committed unresolved leaves `<<<<<<<` markers in a file npm reads
        # as JSON: `npm ci` then fails with a cryptic parser error, and
        # Snyk's PR check cannot parse the manifest at all. It shipped on
        # main once already (the v1.0.0 merge). Fail here, fast, with the
        # file named — before the confusing npm error.
        with:
          persist-credentials: false
      - name: No unresolved merge markers in lockfiles
        # bash explicitly: windows-latest defaults `run:` to PowerShell,
        # where `if … then … fi` is a syntax error. Git Bash is present
        # on every runner.
        shell: bash
        run: |
          # JSON has no line that is exactly seven <, = or > — so in a
          # lockfile these are unambiguously conflict markers.
          if git grep -nE '^(<{7} |={7}$|>{7} )' -- 'package-lock.json' ':(glob)**/package-lock.json'; then
            echo "::error::committed git conflict markers in a lockfile (above) — resolve the merge"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check-version
      # The brand gate. Every colour, typeface and badge in the tree is
      # checked against src/brand/tokens.ts, and every declared
      # foreground/background pairing has its WCAG contrast computed.
      # Blocking, for the reason doctor is blocking in pages.yml: a
      # brand that is only enforced by review drifts back the moment
      # nobody is looking, which is how six copies of one palette
      # happened.
      - run: npm run brand:doctor
      # And the gate is proven able to fail before it is trusted: each
      # rule is seeded with a deliberate violation, observed rejecting
      # it, and the file restored. A check never seen to fail is not
      # evidence.
      - run: npm run brand:doctor:selftest
      # The vendored webfonts are what ships; this re-verifies the
      # committed bytes against their sha256 manifest, offline. The build
      # itself never fetches a font — the site used to pull Cinzel and
      # Inter from a third party at runtime, on the page whose whole
      # argument is that you should not trust what you have not verified.
      - run: npm run brand:fonts:check
      # The coverage run below executes the complete suite on Ubuntu/Node 22.
      # Keep a plain full-suite run everywhere else so every supported OS and
      # Node line remains covered without running the same suite twice in the
      # coverage job.
      - name: Run test suite (non-coverage matrix entries)
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      # Fixture integrity, non-TS tier (certification-audit Phase 2.4):
      # Python fixtures are real code the detectors consume as text —
      # a syntax error in one must not pass silently. Syntax-tier only
      # (the bytecode artifact is throwaway). Java/C# fixtures have no
      # reliable syntax-check toolchain on all runners; documented INFO
      # (their structural layer stays covered by the fixture firewall
      # + harness oracle).
      - name: Python fixture syntax tier (compileall)
        if: runner.os == 'Linux'
        env:
          # Bytecode must NOT land in the fixture trees: __pycache__ dirs
          # are non-hidden entries the fixture-harness/docs-generator read
          # as fixture files, which would silence the QA-PY rules in every
          # later step (the ubuntu-only coverage run caught exactly that).
          PYTHONPYCACHEPREFIX: /tmp/mjolnir-pycache
        run: |
          if [ -n "$(find tests/fixtures tests/corpus/positive-fixtures -name "*.py" -print -quit)" ]; then
            python3 -m compileall -q tests/fixtures tests/corpus/positive-fixtures
          else
            echo "no Python fixtures present — nothing to compile"
          fi
      # Bug-audit G11: moderate advisories are ignored at `high` — a
      # steady drip of moderate-severity vulns is how a real supply-chain
      # issue goes unnoticed between high ones.
      - name: npm audit
        run: npm run audit:ci
      # Bug-audit G6: headroom must be measurable — the four percentages
      # go into the job summary (and coverage/ is uploaded below) so the
      # ratchet floors can be re-raised against measured numbers. Coverage
      # is the full test run for the canonical Ubuntu/Node 22 entry; keeping
      # it to one matrix entry avoids duplicate instrumented suites while
      # retaining plain full-suite compatibility runs on every OS/Node line.
      # QA-CI-005 verifies this producer/upload pairing on every self-scan.
      - name: Run coverage (canonical Ubuntu/Node 22 entry)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        # --no-file-parallelism: single-worker coverage merge (the
        # cross-worker v8 merge under-attributes branches for files
        # loaded by several workers); generous timeouts because the
        # instrumented run slows git- and child-process-heavy specs.
        # scale-benchmark stays IN: its in-process 3k-file runScan is a
        # major coverage contributor and its own per-test timeouts
        # already give it real headroom.
        run: npm run test:coverage:ci
      - name: Enforce coverage ratchet
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run coverage:ratchet
      - name: Upload coverage report as a build artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-node-22
          path: coverage/
          retention-days: 14
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run test:property

  # Workflow-lint coverage (Beta-to-Stable M4): actionlint, version-pinned
  # so its ruleset is part of the audited supply chain like every other
  # pinned action in this repo. The tarball is downloaded from the pinned
  # release tag and verified against that release's own checksums file
  # before extraction — no curl|bash of mutable script bodies.
  # The site build only ran on push-to-main (pages.yml), so a commit that
  # broke it passed every PR check and failed the deploy after merge —
  # twice: gen-report.mjs requiring a heading the hero asset had dropped,
  # and the `mutation` verb in a doc read by Vue's compiler as an
  # element. This runs the same build + gate pages.yml does, on the PR,
  # where it can still be fixed.
  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # VitePress dates pages from git history; a shallow clone would
          # stamp every page with this commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        working-directory: site
        run: npm ci
      # The ROOT dependencies too. `npm run doctor` below is
      # `node dist/cli.mjs doctor && npm --prefix site run doctor` — the
      # self-audit plus the site doctor — and this job previously installed only
      # the site's, so the step died with `sh: 1: tsdown: not found` when it
      # tried to build. Pre-existing on main.
      #
      # The alternative was splitting the command, and
      # `gates/pr.json` says why that is not free: `site-doctor` is declared as
      # `npm run doctor`, and `gate-tiers.spec.ts` reports a declared gate with
      # no matching step as "declared and never run — the declaration reads as
      # coverage". The declaration is right, so the job gets what it was
      # missing. `--ignore-scripts` because this job needs the tree, not a
      # postinstall side effect, and `cache-dependency-path` above points at
      # the site's lockfile — hence no `cache: npm` benefit here.
      - name: Install root deps (for the doctor)
        run: npm ci --ignore-scripts
      - name: Build mjolnir (for the doctor)
        run: npm run build
      - name: Test the catalog generator
        working-directory: site
        run: npm test
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Site doctor
        run: npm run doctor

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: v1.7.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REQUIRED by the last step in this job. `check-version --base=…`
          # runs `git diff --name-only <base>..HEAD`, and the default
          # `fetch-depth: 1` checkout has no `origin/<base>` ref at all:
          #   fatal: ambiguous argument 'origin/main..HEAD': unknown revision
          # On a push to main the base IS HEAD, so the diff is empty and the
          # ref resolves — the step passes there. On a pull request the base
          # is a different commit and the step dies, so every PR fails on a
          # defect only main can hide. Lines 189 and 379 already fetch full
          # history for the same reason; this job was missed.
          fetch-depth: 0
      # ci:standard reads ci.yml and mjolnir.yml through the `yaml`
      # dependency, so this job needs the workspace installed. It was
      # unit-tested (tests/integrations/ci-standard.spec.ts) but wired to
      # no workflow, so nothing ran it in CI.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          # Keep the distribution filename: sha256sum -c matches the name
          # recorded in the checksums manifest, so a renamed download
          # would silently check nothing (first run failed exactly here).
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo checksums.txt "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_checksums.txt"
          grep "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" actionlint
      - name: actionlint (all repo workflows)
        run: ./actionlint -color
      - name: CI standard (PR scan gate layers + least-privilege invariants)
        run: npm run ci:standard

      # The gate-set invariant, on a PR.
      #
      # It was nightly-only until 6.0, which is precisely why the nightly gate
      # file drifted for a release: a `pr.json` entry with no matching step, a
      # release gate missing from nightly, a gate id duplicated under two names
      # — all invisible to every PR for up to 24 hours, and three such
      # defects shipped in 5.x. The check costs one file read; the cost of NOT
      # running it on a PR is a week of someone's attention.
      - name: Gate-tier invariant (pr ⊆ release ⊆ nightly)
        run: npm run gates:check

      # The two entry points, and their budgets. `npm run check` is what a PR
      # runs and it is at most 12 commands; `npm run certify` is the release
      # path and must reach everything `check` does. Declared in
      # `gates/pr.json` for the same reason the step above is here.
      - name: Entry-point budget
        run: npm run entry-points:check

      # The claim-integrity gates, as ONE step.
      #
      # Each of these is a separate npm script so a failure names the gate
      # rather than "certify:ci step 14 of 24", and they are chained behind
      # one entry point so the workflow does not grow a step per gate. The
      # 6.0 lesson is the reason this is here at all: nine of them ran only
      # in `certify`/`ci-local`, so a PR that broke IR parity or left a script
      # wired to nothing passed CI and failed on the maintainer's machine.
      # `--base` is REQUIRED here, not a convenience. The gate's default reads
      # `git status`, which is EMPTY on a CI checkout — so without it this
      # step reports PASS on every run and the one thing it exists to catch
      # (a change shipped with no release note) is not caught in CI at all.
      - name: Claim-integrity gates
        run: npm run gates:claim-integrity

      - name: Unreleased changelog entry
        run: npm run check-version -- --base=origin/${{ github.base_ref || 'main' }}

  # Self-scan gate (§30.2 #7) — activates once rules exist.
  self-scan:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.mjs src --json > self-scan.json
      # Self-scan annotations (plan M4): inline findings on the run page
      # via the same single emitter the generated workflow uses.
      - name: Self-scan annotations
        if: always()
        # Renders the SAVED report, which is what this step already has on disk.
        # The verb it used to call was removed by the v6 positioning carve, so
        # the step exited 10 with `unknown subcommand` on every run. It never
        # showed up because the job is `needs: build-test`, which had been
        # failing, so this job was `skipped`.
        #
        # `--format github-summary` is the other rendering surface and is NOT a
        # substitute here: it needs a live scan, not the artifact written two
        # steps above. The removed verb is not named in this comment either,
        # because `check-cli-contract` reads any mention of it in this file as a
        # live consumer — which is right, and is why a comment that quotes a
        # dead command is a thing to avoid writing.
        run: node dist/cli.mjs explain verdict --json self-scan.json
      # Bug-audit G8 (self-scan honesty gate): the old gate blocked only on
      # error-severity findings — a TRUNCATED self-scan (partial: true) or
      # one where rules crashed silently passed. A truncated self-scan of
      # this tool's own repo is a pipeline bug, not a green run.
      - name: Self-scan honesty gate
        run: |
          node -e "const r=require('./self-scan.json');if(r.partial===true){console.error('Self-scan was PARTIAL — a truncated scan must not pass the gate.');process.exit(1)}if((r.analysisStatus&&r.analysisStatus.rulesCrashed||0)>0){console.error('Self-scan had',r.analysisStatus.rulesCrashed,'rule crash(es) — crash isolation must never hide from the dogfood gate.');process.exit(1)}const errs=r.findings.filter(f=>f.severity==='error');if(errs.length){console.error('Self-scan errors:',errs);process.exit(1)}const warns=r.findings.filter(f=>f.severity==='warning');if(warns.length){console.log(warns.length+' warning(s) — non-blocking, see the uploaded artifact.')}"
      - name: Add warning count to the job summary (non-blocking)
        if: always()
        run: |
          node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('self-scan.json','utf8'));const n=r.findings.filter(f=>f.severity==='warning').length;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Self-scan warnings (non-blocking) - '+n+'\n')}catch(e){}"
      - name: Generate badge artifact (Master-Stabilization-Plan Sprint 2 Task 11)
        continue-on-error: true
        # Removed with `src/commands/badge.ts` in the v6 carve: the product emits
        # no shields.io badge, and the PR comment renders HTML cells instead.
        # `continue-on-error: true` is why this never surfaced as a failure — it
        # has been exiting 10 silently since the carve.
        run: |
          echo "::notice::No badge artifact: the badge command was removed with the v6 carve."
          echo '{"note":"badge generation retired; see CHANGELOG 5.1.0"}' > mjolnir-badge.json
      - name: Upload self-scan result as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-scan-result
          path: |
            self-scan.json
            mjolnir-badge.json
          retention-days: 90

  # Certification gate (certification-audit Phase 5.5, G2/G5): the doctor
  # self-audit runs on the BUILT artifact and gates the pipeline — exit 0
  # requires every check pass (a fail OR an INCONCLUSIVE check exits 1).
  # The JSON report is the evidence artifact; determinism is re-proven by
  # running the command twice and diffing (G5 self-verify).
  certification:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # WI-12A: keep the gate honest on main too — every CI run validates
      # the CURRENT version's CHANGELOG section (cheap; the release flow
      # re-runs it release-blocking with --rules-touched semantics).
      - name: CHANGELOG integrity gate (WI-12A)
        run: npm run check-version -- --expect-version "$(node -p "require('./package.json').version")"
      # WI-10 (plan §14): reporter version-sync gate — ADVISORY while the
      # reporter line is unpublished; becomes blocking after three green
      # release cycles. The hard-drift case (reporter AHEAD of the root
      # package; ingestion-contract break) exits 1 even in advisory mode.
      - name: Reporter version-sync gate (advisory)
        run: npm run check-version
      - name: Doctor self-audit gate (exit 0 = all checks pass)
        run: node dist/cli.mjs doctor . --json > doctor-report.json
      - name: G5 determinism self-verify (second run must be byte-identical)
        run: |
          node dist/cli.mjs doctor . --json > /tmp/doctor-report-2.json
          if diff doctor-report.json /tmp/doctor-report-2.json; then
            echo "doctor --json: byte-identical across runs ✓"
          else
            echo "doctor --json output is NOT deterministic — G5 violated"
            exit 1
          fi
      - name: F2 scan-artifact determinism (two scans byte-identical minus durationMs allowlist)
        run: node scripts/scan-determinism-replay.mjs src
      - name: Sanity-check the report contract in the summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("doctor-report.json", "utf8"));
          if (r.schema !== "mjolnir.doctor-report@1") { console.error("unknown schema", r.schema); process.exit(1); }
          const verdict = r.healthy ? "WORTHY" : "VIOLATIONS";
          const line = "doctor: " + r.summary.pass + " pass · " + r.summary.fail + " fail · " + r.summary.inconclusive + " inconclusive → " + verdict;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          console.log(line);
          '
      - name: Upload doctor report as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doctor-report
          path: doctor-report.json
          retention-days: 90

  # Detector revision integrity, check C (certification-audit Phase 3.4,
  # G4/D17): a WARN-level review visibility step — a detector whose source
  # identity changed without a declared revision bump gets a ::warning::
  # annotation asking for a behavior-neutrality statement or a bump. Never
  # a hard fail: a hard fail would manufacture the routine-bump culture
  # G4 prohibits. The blocking invariants (manifest ↔ source ↔ registry)
  # are owned by the doctor's revision-integrity check inside npm test.
  detector-revision-diff:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diff detector-hashes manifest against base branch
        run: |
          BASE="$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD)"
          git show "${BASE}:tests/corpus/detector-hashes.json" > /tmp/detector-hashes-base.json \
            || echo "no base manifest (first landing)"
          if [ -s /tmp/detector-hashes-base.json ]; then
            # `scripts/check-detector-hashes.ts`, not `scripts/diff-detector-hashes.ts`.
            #
            # The step named a script that does not exist, so it died with
            #   Error [ERR_MODULE_NOT_FOUND]: Cannot find module
            #   '.../scripts/diff-detector-hashes.ts'
            # The capability is not missing: this script's own header documents
            # `--base <manifest>` as "REVIEW VISIBILITY, the CI base-diff", and
            # the staleness arm in the same file is the gate that can block.
            # One file, two modes — the shape the script says it exists to
            # avoid duplicating.
            #
            # The step never ran before, because `needs: build-test` and
            # build-test had been failing, so the job was always `skipped`.
            npm run check-detector-hashes -- --base /tmp/detector-hashes-base.json
          else
            echo "INFO: no detector-hashes manifest on the base branch (first landing) — nothing to diff."
          fi

  # Bug-audit B4.31 (generated-docs drift gate): docs/rules pages, the
  # COUNT-LOCK FP-audit table and the golden lock are GENERATED artifacts.
  # If a rule change lands without re-running its generator, the committed
  # docs silently drift from what the code actually does. This job
  # regenerates everything and fails on any diff (same pattern as the
  # hero-asset reproducibility test).
  generated-docs-drift:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate docs, COUNT-LOCK table and golden lock
        run: |
          npm run docs:regen
      - name: Fail when committed artifacts differ from regenerated ones
        run: |
          # `--all` because this job also gates the whole tree, not just the
          # generated surfaces: a generator that writes OUTSIDE the declared
          # output map is a defect in that map, and only a whole-tree diff
          # notices. The script is the single implementation; the three release
          # workflows call the same one without `--all`.
          npm run docs:staleness -- --all
          git diff --exit-code
      # F3 (certification-audit remediation): agent instruction surfaces
      # are version-stamped generated content the regen step above never
      # touched — the v0.5.15-stamp drift shipped silently through this
      # job. planInstall is deterministic (version-pinned, no timestamps),
      # so re-planning here and failing on any mismatch closes the hole.
      - name: Managed-surface stamp gate (agent surfaces match the install plan)
        run: npx tsx scripts/check-managed-surfaces.mjs .
