name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level (audit S-3/S-10): no job in this
# workflow needs write access to anything. Declared here so a new job
# cannot silently inherit the repository default.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tsdown requires ^22.18.0 || >=24.11.0 — Node 20 cannot build.
        # Bug-audit G7: node 24 is the current LTS and inside the engines
        # claim — one ubuntu canary keeps the >=22.18 promise honest
        # without tripling the matrix.
        node: [22, 24]
        exclude:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    # Audit S-7: a hung npm ci or scan must not sit for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Bug-audit G11: moderate advisories are ignored at `high` — a
      # steady drip of moderate-severity vulns is how a real supply-chain
      # issue goes unnoticed between high ones.
      - run: npm audit --audit-level=moderate
      # Bug-audit G6: headroom must be measurable — the four percentages
      # go into the job summary (and coverage/ is uploaded below) so the
      # ratchet floors can be re-raised against measured numbers. Runs
      # vitest with --coverage directly so the coverage run is visible
      # as such (QA-CI-005 verifies this pairing on every self-scan).
      - name: Run coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        # --no-file-parallelism: single-worker coverage merge (the
        # cross-worker v8 merge under-attributes branches for files
        # loaded by several workers); generous timeouts because the
        # instrumented run slows git- and child-process-heavy specs.
        # scale-benchmark stays IN: its in-process 3k-file runScan is a
        # major coverage contributor and its own per-test timeouts
        # already give it real headroom.
        run: >-
          npx vitest run --coverage --no-file-parallelism
          --testTimeout=120000 --hookTimeout=120000
      - name: Report coverage floors in the job summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const t = s.total;
          const line = "Statements " + t.statements.pct + "% · Branches " + t.branches.pct + "% · Functions " + t.functions.pct + "% · Lines " + t.lines.pct + "%";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Coverage floors\n" + line + "\n");
          console.log(line);
          '
      - name: Upload coverage report as a build artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Self-scan gate (§30.2 #7) — activates once rules exist.
  self-scan:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.mjs . --json > self-scan.json
      # Bug-audit G8 (self-scan honesty gate): the old gate blocked only on
      # error-severity findings — a TRUNCATED self-scan (partial: true) or
      # one where rules crashed silently passed. A truncated self-scan of
      # this tool's own repo is a pipeline bug, not a green run.
      - name: Self-scan honesty gate
        run: |
          node -e "const r=require('./self-scan.json');if(r.partial===true){console.error('Self-scan was PARTIAL — a truncated scan must not pass the gate.');process.exit(1)}if((r.analysisStatus&&r.analysisStatus.rulesCrashed||0)>0){console.error('Self-scan had',r.analysisStatus.rulesCrashed,'rule crash(es) — crash isolation must never hide from the dogfood gate.');process.exit(1)}const errs=r.findings.filter(f=>f.severity==='error');if(errs.length){console.error('Self-scan errors:',errs);process.exit(1)}const warns=r.findings.filter(f=>f.severity==='warning');if(warns.length){console.log(warns.length+' warning(s) — non-blocking, see the uploaded artifact.')}"
      - name: Add warning count to the job summary (non-blocking)
        if: always()
        run: |
          node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('self-scan.json','utf8'));const n=r.findings.filter(f=>f.severity==='warning').length;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Self-scan warnings (non-blocking) - '+n+'\n')}catch(e){}"
      - name: Generate badge artifact (Master-Stabilization-Plan Sprint 2 Task 11)
        continue-on-error: true
        run: node dist/cli.mjs badge .
      - name: Upload self-scan result as a build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-scan-result
          path: |
            self-scan.json
            mjolnir-badge.json
          retention-days: 90

  # Bug-audit B4.31 (generated-docs drift gate): docs/rules pages, the
  # COUNT-LOCK FP-audit table and the golden lock are GENERATED artifacts.
  # If a rule change lands without re-running its generator, the committed
  # docs silently drift from what the code actually does. This job
  # regenerates everything and fails on any diff (same pattern as the
  # hero-asset reproducibility test).
  generated-docs-drift:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate docs, COUNT-LOCK table and golden lock
        run: |
          npm run docs:rules
          npm run fp-audit:generate
          npm run docs:capability
          npm run golden:update
          npm run docs:hero
          npm run docs:demo
      - name: Fail when committed artifacts differ from regenerated ones
        run: |
          git diff --exit-code
          # `git diff` cannot see UNTRACKED generated files (e.g. the
          # docs/rules page of a newly added rule) — those would ship
          # silently. Fail on any unexpected generated output too.
          untracked="$(git ls-files --others --exclude-standard docs/rules docs/COUNT-LOCK.md docs/FP-AUDIT.md docs/RULE-CAPABILITY-MATRIX.md docs/RULE-CAPABILITY-MATRIX.json tests/golden assets/readme)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated artifacts — commit them:"
            echo "$untracked"
            exit 1
          fi
