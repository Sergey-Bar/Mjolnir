name: Mjölnir

on:
  pull_request:

concurrency:
  group: mjolnir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run analysis
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node dist/cli.mjs . --scope changed --format json > mjolnir.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -s mjolnir.json ]; then
            printf '{"schemaVersion":1,"partial":true,"score":null,"reason":"analysis-failed","frameworks":[],"frameworkDetectionUnknown":true,"dimensions":[],"findings":[],"analysisStatus":{"discovery":"partial","rules":"partial","skippedFiles":0,"durationMs":0,"reasons":["analysis-failed"]}}\n' > mjolnir.json
          fi
          exit 0
      - name: Render unified report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node dist/cli.mjs pr-comment --from mjolnir.json > mjolnir-comment.md
          if [ ! -s mjolnir-comment.md ]; then
            printf '<!-- mjolnir-report:v2 -->\n## Mjölnir report unavailable\n\nAnalysis could not be rendered. No clean or worthy claim is made.\n' > mjolnir-comment.md
          fi
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mjolnir-report
          path: mjolnir-comment.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: scan
    if: ${{ always() && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mjolnir-report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('mjolnir-comment.md', 'utf8');
            if (!body.trim()) return;
            const marker = '<!-- mjolnir-report:v2 -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 },
            );
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
