name: Mjölnir

on:
  pull_request:

concurrency:
  group: mjolnir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Audit S-7: a hung scan must not sit for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for --scope changed merge-base and impact/diff history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # F6 toolchain cache probe (Beta-to-Stable M5): npm-download
          # cache keyed on the lockfile. Explicit save happens in
          # setup-node's post step. Dogfooded here first; the generated
          # template deliberately stays npx-only (no lockfile to key a
          # cache on — the pinned @version is its own cache key).
          cache: npm
      # Audit S-5: event data reaches the shell through env, never by
      # interpolation into the `run:` body — the pattern this repo's own
      # QA-CI rules enforce in other people's workflows.
      - name: Restore baseline from base branch (best-effort)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git checkout "origin/$BASE_REF" -- .mjolnir/baseline.json 2>/dev/null || echo "No committed baseline on base branch — diff will report UNKNOWN, not a fabricated zero."
      # Build and run the CLI *from this PR's source*, not `npx
      # mjolnir-qa@latest`. Scanning a PR with the last published release
      # means the tool never reviews the change under review: a rule fixed
      # in the PR still fires, a rule added in the PR never runs, and the
      # workflow cannot function at all while a published build is broken.
      # Dogfooding requires running the code being proposed.
      - run: npm ci && npm run build
      - run: node dist/cli.mjs . --scope changed --json > mjolnir.json
      # Advisory mode by design: this workflow reports findings, it never
      # blocks a PR. `diff` legitimately exits 1 when it finds new/worsened
      # debt — continue-on-error on THIS step only keeps that exit code
      # visible in the Job Summary UI while not failing the job.
      - name: Diff against baseline (advisory — may exit 1 on new debt)
        id: diff
        continue-on-error: true
        run: node dist/cli.mjs diff . > mjolnir-diff.txt
      - run: node dist/cli.mjs pr-comment . > mjolnir-comment.md
      # Audit S-6: on a pull_request event from a fork the GITHUB_TOKEN is
      # read-only and the comment step will 403 for every external
      # contributor. The comment is best-effort; the Job Summary below is
      # the fallback that always renders. (pull_request_target would fix
      # the token but is a code-execution risk — deliberately NOT used.)
      - name: Append findings to the Job Summary (works on fork PRs)
        if: always()
        run: cat mjolnir-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update PR comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('mjolnir-comment.md', 'utf8');
            const marker = '<!-- mjolnir-pr-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
