name: Greetings

on: [pull_request_target, issues]

permissions:
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v1.3.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Welcome! Thanks for your first issue."
          pr_message: "Welcome! Thanks for your first pull request."
