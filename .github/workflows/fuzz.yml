name: Fuzz

on:
  schedule:
    # Nightly at 03:00 UTC — sustained property-based testing window.
    - cron: "0 3 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Run fuzz tests (30 min budget)
        run: npm run test:fuzz
        timeout-minutes: 30
