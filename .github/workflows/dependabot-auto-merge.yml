name: Dependabot Auto-Merge

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `github.actor` is whoever fired the event, not whoever opened the PR:
    # on `labeled` that is the human applying the label, so this condition was
    # false on the one trigger that matters, and on `opened`/`synchronize` the
    # label was not there yet. The job could never run. Identify the PR by its
    # author, which is what "is this a Dependabot PR" actually means.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
