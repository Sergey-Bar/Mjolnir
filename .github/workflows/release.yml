name: Release

# Automatic release: push a version tag (v*) → CI runs → GitHub Release
# is created with auto-generated notes from all merged PRs/commits since
# the previous tag, plus the built CLI attached as a tarball.
#
# Usage:
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # id-token: write is required for `npm publish --provenance` (OIDC).
    # Harmless to declare ahead of time even while the publish step below
    # stays gated off — this permission has no effect unless something
    # in the job actually requests an OIDC token.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci

      # The SARIF reporter hardcodes the tool version (kept honest by
      # tests/version-consistency.spec.ts). Sync it to the released
      # package.json version here so a release can never ship with a
      # stale driver.version — the source of truth is package.json.
      - name: Sync SARIF driver version to package.json
        run: node scripts/sync-sarif-version.cjs

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - run: npm run build

      - name: Pack distribution tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination ./release-assets

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.tgz
          body: |
            Install: `npx qa-doctor@${{ github.ref_name }} .`
            Full changelog is auto-generated below from all commits and PRs since the previous release.

      # npm publish is intentionally gated off — see docs/PUBLISHING.md
      # and Master-Stabilization-Plan.md §5 (parked decision). The npm
      # name "qa-doctor" belongs to an unrelated project; `npm publish`
      # would fail 403 today. This step becomes live once that decision
      # resolves (most likely: publish under a scoped name, e.g.
      # @<scope>/qa-doctor, keeping the "qa-doctor" bin command name).
      #
      # Provenance (--provenance) requires: (1) the npmjs.com package to
      # have OIDC "trusted publisher" configured for this exact repo +
      # workflow file (one-time, account-level, done on npmjs.com by a
      # maintainer — cannot be automated from inside this repo, see the
      # runbook in docs/PUBLISHING.md), and (2) id-token: write below.
      - name: Publish to npm with provenance
        if: false # flip once the npm name decision (§5) resolves
        run: npm publish --provenance --access public
