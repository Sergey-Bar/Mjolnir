name: Release

# Two release paths, one workflow file (the npmjs.com Trusted Publisher
# matches the workflow FILENAME exactly — a second file would fail OIDC
# with ENEEDAUTH):
#
# 1. Automated (default): merge to `main` → the `version` job computes
#    the bump from PR labels (no label = patch; release:major / minor /
#    skip override), collapses CHANGELOG.md's [Unreleased] sections
#    under the new version, commits + tags v<X> as mjolnir-release-bot,
#    and the `release` job publishes from that tag. Zero manual
#    commands.
# 2. Manual: push a version tag (v*) or `gh workflow run release.yml
#    -f tag=vX.Y.Z` → the `release` job runs the full gate and
#    publishes. This is the rc-channel path (docs/PUBLISHING.md).
#
# ORDER MATTERS. npm publish runs BEFORE the GitHub Release is created,
# and the release job refuses to create a Release until the version is
# actually resolvable on the registry. The reverse order shipped a
# public "v0.5.0 · Latest" Release for a version that npm never
# received, because the publish step failed after the Release step had
# already succeeded. A GitHub Release is a promise that `npm i` works;
# it must not be made before that is true.

on:
  push:
    # Auto-release path: every merge to main produces exactly one
    # release (major/minor/patch — no gaps, no manual npm version).
    branches:
      - main
    # Manual rc releases (npm version 1.1.0-rc.1 + push --follow-tags).
    tags:
      - "v*"
  # Re-run a release for a tag that already exists. Needed whenever a
  # release fails for a reason outside the repo — registry auth, a flaky
  # runner — where the fix is a settings change and the code is fine.
  # Without this the only retry path is deleting and force-pushing the
  # tag, which rewrites history anyone who already fetched it has.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.5.0)"
        required: true
        type: string

# Least privilege at the top level; each job escalates what it actually
# needs via job-level `permissions`.
permissions:
  contents: read

# Serializes simultaneous main-push runs (queued merges release in
# order, one version each); tag runs group per-tag. The registry
# duplicate-skip in the release job absorbs any remaining race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: version — the auto-release brain ─────────────────────────
  # Runs ONLY on branch pushes to main (tag pushes and workflow_dispatch
  # skip straight to the release job below).
  version:
    name: Compute and cut the next version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the bump commit + tag to main
      pull-requests: read # label lookups for every PR in the range
    outputs:
      bump: ${{ steps.compute.outputs.bump }}
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      # True when any phase decided to skip (bot-commit loop guard, no
      # commits since last tag, or every commit labeled release:skip).
      skip: >-
        ${{
          steps.guard.outputs.skip == 'true'
          || steps.commits.outputs.skip == 'true'
          || steps.compute.outputs.skip == 'true'
        }}
    steps:
      # Full history + all tags: the range since the last release tag
      # and the loop guard both need them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Loop-breaker / idempotency guard. The bot's own bump commit is
      # tagged v<its package.json version> AT HEAD; a regular merge
      # commit never is. (A GITHUB_TOKEN push does not trigger workflow
      # runs, so this guards re-runs and future PAT-based pushes too.)
      - name: Loop guard — HEAD already tagged with its own version?
        id: guard
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          HEAD_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -n "$HEAD_TAG" ] && [ "$HEAD_TAG" = "v$PKG_VERSION" ]; then
            echo "HEAD is tagged $HEAD_TAG — this push is the release bot's own bump commit. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD is not a release commit (package version $PKG_VERSION). Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect commits since the last tag
        id: commits
        if: steps.guard.outputs.skip != 'true'
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          RANGE="${LAST_TAG:+"$LAST_TAG.."}HEAD"
          COUNT="$(git rev-list --count "$RANGE")"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No commits since ${LAST_TAG:-the first commit} — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Commits since ${LAST_TAG:-the beginning}: $COUNT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Thin wrapper: scripts/compute-release.mjs resolves labels via
      # `gh pr view` and writes bump/skip to $GITHUB_OUTPUT. Label
      # failures fall back to patch with a ::warning:: — never fatal.
      - name: Resolve the bump from PR labels
        id: compute
        if: steps.commits.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/compute-release.mjs --github-output --range "${{ steps.commits.outputs.range }}"

      - name: Cut the release commit and tag
        id: cut
        if: steps.compute.outputs.skip != 'true'
        env:
          BUMP: ${{ steps.compute.outputs.bump }}
        run: |
          git config user.name "mjolnir-release-bot"
          git config user.email "bot@users.noreply.github.com"
          NEW_VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          NEW_VERSION="${NEW_VERSION#v}"
          node scripts/sync-sarif-version.cjs
          node scripts/release-changelog.mjs "$NEW_VERSION" "$(date -u +%F)"
          git add -A
          git commit -m "chore(release): v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin "HEAD:refs/heads/main" "refs/tags/v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Cut v$NEW_VERSION (bump: $BUMP) and pushed commit + tag."

  # ── Job 2: release — the publish pipeline (unchanged) ───────────────
  # For tag pushes and workflow_dispatch the version job above is
  # skipped and this job releases the tag directly. For main-branch
  # pushes it runs only when the version job actually cut a tag —
  # never on skip and never on a failed version job (no half state:
  # no release commit means no publish).
  release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() && !cancelled() &&
      (
        (needs.version.result == 'skipped' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')))
        || (needs.version.result == 'success' && needs.version.outputs.skip != 'true')
      )
    # id-token: write is required for `npm publish --provenance` (OIDC).
    permissions:
      contents: write
      id-token: write
    env:
      # One name for "the tag being released", whichever trigger fired.
      # Read through env rather than interpolated into `run:` bodies so a
      # tag name can never be parsed as shell.
      RELEASE_TAG: ${{ inputs.tag || needs.version.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          # Required for `npm publish` (including OIDC trusted publishing)
          # to target the public registry with the right auth setup.
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json (v$PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "Releasing $RELEASE_TAG (package version $PKG_VERSION)"

      - run: npm ci

      # The SARIF reporter hardcodes the tool version (kept honest by
      # tests/version-consistency.spec.ts). Sync it to the released
      # package.json version here so a release can never ship with a
      # stale driver.version — the source of truth is package.json.
      - name: Sync SARIF driver version to package.json
        run: node scripts/sync-sarif-version.cjs

      - name: Typecheck, lint, test, coverage
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:coverage

      - run: npm run build

      - name: Pack distribution tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination ./release-assets

      # Idempotency. A version already on the registry must not be a hard
      # failure: re-running a release for an existing tag (workflow_dispatch
      # above), or backfilling a tag for a version published earlier, is a
      # legitimate thing to do and npm rejects a duplicate publish with
      # E403. Skip the publish, keep the verification.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "mjolnir-qa@${VERSION}" version >/dev/null 2>&1; then
            echo "Already on npm — publish will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not on npm yet — publish will run."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm publish runs only once the repo variable NPM_PUBLISH is set to
      # "true" (Settings → Secrets and variables → Actions → Variables, or
      # `gh variable set NPM_PUBLISH --body true`). That gate exists so a
      # tag push cannot attempt to publish before the one-time npmjs.com
      # OIDC trusted-publisher setup is done.
      #
      # Trusted publishing (no NODE_AUTH_TOKEN) requires the npmjs.com
      # package to have a trusted publisher configured for this exact repo
      # + workflow file. That is account-level and cannot be automated from
      # inside this repo. Full runbook: docs/PUBLISHING.md.
      #
      # Node 22 ships npm 10, which does NOT support OIDC trusted publishing —
      # it falls back to token auth (empty NODE_AUTH_TOKEN placeholder) and the
      # publish PUT fails with a misleading "404 Not Found". OIDC needs npm
      # >= 11.5.1. Done here, after the test gate, so the rest of the job keeps
      # running on the toolchain-pinned npm.
      #
      # Pinned to the npm 11 line deliberately, NOT @latest: npm 12.0
      # (current latest) changed `npm pack --json` from an array to an
      # object keyed by package name, which broke the fresh-install gate
      # below on the very first auto-release (v0.5.1, 2026-09-05 — tag
      # cut, publish stopped by the gate, nothing shipped). The gate's
      # parsers now tolerate both shapes, but npm 12's publish/OIDC path
      # is unproven for this pipeline — move to 12 as a deliberate,
      # separately-verified change, never via an implicit @latest drift.
      - name: Upgrade npm for OIDC trusted publishing
        if: vars.NPM_PUBLISH == 'true' && steps.registry.outputs.published != 'true'
        run: npm install -g npm@11

      # setup-node writes an .npmrc containing `always-auth=true` and
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With
      # NODE_AUTH_TOKEN unset, `always-auth` still forces npm to send an
      # (empty) token on the publish PUT instead of falling back to OIDC —
      # the registry then answers `404 … or you do not have permission`.
      # Replace it with a bare registry line so npm 11's OIDC trusted
      # publishing (id-token: write) takes over.
      - name: Neutralize token auth so OIDC is used
        if: vars.NPM_PUBLISH == 'true' && steps.registry.outputs.published != 'true'
        run: |
          echo "registry=https://registry.npmjs.org/" > "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npm $(npm --version)"
          echo "id-token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npm config get registry

      # Bare `npm publish`: npm >= 11.5.1 auto-detects the CI OIDC context and,
      # if a matching trusted publisher is configured on npmjs.com, exchanges
      # the id-token for a short-lived publish token and attaches provenance
      # automatically.
      #
      # `ENEEDAUTH` / "OIDC token exchange error - package not found" here
      # means the trusted-publisher config does NOT match this run's OIDC
      # claims. Check on npmjs.com → mjolnir-qa → Settings → Publishing
      # access: repository must be Sergey-Bar/Mjolnir, workflow must be
      # release.yml, and the Environment field must be EMPTY.
      # Bug-audit G5 (pre-publish install gate): the real-registry install
      # proof used to run only in the NIGHTLY release-smoke workflow, so a
      # tag pushed between nightlies published without a fresh-install
      # gate. This packs the exact tarball about to be published and
      # installs it into a clean directory (real registry dependency
      # resolution) — the same proof release-smoke runs, now unskippable
      # on the publish path.
      - name: Fresh-install gate (pack → clean install → run bin)
        if: vars.NPM_PUBLISH == 'true' && steps.registry.outputs.published != 'true'
        env:
          RUN_REGISTRY_INSTALL_TEST: "1"
        run: npx vitest run tests/integrations/registry-install.spec.ts

      # M4: rc tags (vX.Y.Z-rc.N) publish under the `next` dist-tag and
      # never `latest`; promotion to `latest` happens only at the final
      # (non-prerelease) tag. Stable tags publish with no dist-tag
      # argument — npm defaults that to `latest`.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          if echo "$VERSION" | grep -Eq -- '-rc\.[0-9]+$'; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Prerelease $VERSION — will publish under dist-tag next"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable $VERSION — will publish under dist-tag latest"
          fi

      - name: Publish to npm (OIDC trusted publishing)
        if: vars.NPM_PUBLISH == 'true' && steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}" --loglevel verbose

      # The gate that makes the GitHub Release below honest. Registry reads
      # can lag a publish by a few seconds, so this polls rather than
      # asserting once. If the package is not resolvable, the job fails
      # here and no Release is created. For an rc, the poll checks the
      # `next` dist-tag — the version must be installable from the channel
      # it was published to, or the Release lies.
      - name: Verify the published version is live on npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          DIST_TAG="${{ steps.disttag.outputs.tag }}"
          for attempt in 1 2 3 4 5 6; do
            FOUND="$(npm view "mjolnir-qa@${DIST_TAG}" version 2>/dev/null || true)"
            if [ "$FOUND" = "$VERSION" ]; then
              echo "mjolnir-qa@${VERSION} is live on the registry under dist-tag ${DIST_TAG}."
              exit 0
            fi
            echo "Not resolvable yet (attempt ${attempt}/6) — waiting 10s."
            sleep 10
          done
          echo "::error::mjolnir-qa@${VERSION} is not resolvable on the registry under dist-tag ${DIST_TAG}. Refusing to create a GitHub Release for a version nobody can install."
          exit 1

      # Last, and only now: everything above proved the package is real.
      # rc tags create a pre-release marked "Pre-release" on GitHub so it
      # can never be mistaken for a stable announcement.
      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ steps.disttag.outputs.tag == 'next' }}
          files: release-assets/*.tgz
          body: |
            Install: `npx mjolnir-qa@${{ env.VERSION }} .`
            Full changelog is auto-generated below from all commits and PRs since the previous release.
