name: Release Candidate

on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and package only; publishing still requires repository approval.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      checksum: ${{ steps.package.outputs.checksum }}
      commit: ${{ steps.context.outputs.commit }}
      dry_run: ${{ steps.context.outputs.dry_run }}
      package_name: ${{ steps.context.outputs.package_name }}
      tag: ${{ steps.context.outputs.tag }}
      tarball: ${{ steps.package.outputs.tarball }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - id: context
        name: Validate release identity
        shell: bash
        env:
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "::error::Release Candidate requires a package version like 2.0.3-rc.1"
            exit 1
          }
          BASE_VERSION=${VERSION%%-rc.*}
          TAG="v$VERSION"
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" == "$TAG" ]] || {
              echo "::error::Tag $REF_NAME does not match package version $VERSION"
              exit 1
            }
            [[ "$(git cat-file -t "refs/tags/$TAG")" == "tag" ]] || {
              echo "::error::$TAG must be an annotated tag"
              exit 1
            }
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || {
              echo "::error::$TAG does not point at the checked-out commit"
              exit 1
            }
          else
            [[ "$EVENT_NAME" == "workflow_dispatch" ]] || {
              echo "::error::Branch releases require workflow_dispatch"
              exit 1
            }
            [[ "$REF_NAME" == "release/v$BASE_VERSION" ]] || {
              echo "::error::Use release/v$BASE_VERSION for $VERSION"
              exit 1
            }
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::Release candidate is not descended from protected main"
            exit 1
          }
          DRY_RUN=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_DRY_RUN" == "false" ]]; then
            DRY_RUN=false
          fi
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "dry_run=$DRY_RUN"
            echo "package_name=$PACKAGE_NAME"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - id: changelog
        name: Validate exact RC changelog section
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$EXPECTED_VERSION"
          BASE_VERSION=${VERSION%%-rc.*}
          BASE_REF=$(git rev-parse --verify "refs/tags/v$BASE_VERSION^{commit}" 2>/dev/null || git rev-parse origin/main)
          EXTRA=()
          if ! git diff --quiet "$BASE_REF" HEAD -- src/rules; then
            EXTRA+=(--rules-touched)
          fi
          npm run changelog:check -- --expect-version "$VERSION" "${EXTRA[@]}"
      - name: Require authorized candidate evidence
        if: steps.context.outputs.dry_run == 'false'
        run: |
          npm run m26:audit
          npm run candidate:readiness
      - name: Run release certification
        run: npm run ci-local
      - name: Release-trust gate (verdict must PASS)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          node dist/cli.mjs release-trust --json > release-assets/release-trust.json
          node dist/cli.mjs release-trust > release-assets/release-trust.txt
      - id: package
        name: Pack, audit, and fresh-install gate
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.context.outputs.package_name }}
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          TARBALL=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)
          [[ -f "$RUNNER_TEMP/$TARBALL" ]] || {
            echo "::error::npm pack did not produce $TARBALL"
            exit 1
          }
          cp "$RUNNER_TEMP/$TARBALL" "$GITHUB_WORKSPACE/release-artifact/$TARBALL"
          CHECKSUM=$(sha256sum "$GITHUB_WORKSPACE/release-artifact/$TARBALL" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$CHECKSUM" "$TARBALL" > "$GITHUB_WORKSPACE/release-artifact/$TARBALL.sha256"
          node scripts/pack-audit.mjs "$GITHUB_WORKSPACE/release-artifact/$TARBALL"
          SMOKE_DIR=$(mktemp -d)
          npm install --prefix "$SMOKE_DIR" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/release-artifact/$TARBALL"
          test "$(node "$SMOKE_DIR/node_modules/mjolnir-qa/dist/cli.mjs" --version)" = "mjolnir-qa $VERSION"
          rm -rf "$SMOKE_DIR"
          {
            echo "artifact_name=release-candidate-$VERSION"
            echo "checksum=$CHECKSUM"
            echo "tarball=$TARBALL"
          } >> "$GITHUB_OUTPUT"
          test "$TARBALL" = "mjolnir-qa-$VERSION.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            release-artifact/
            release-assets/
          if-no-files-found: error
          retention-days: 14

  tag:
    needs: verify
    if: needs.verify.outputs.dry_run == 'false' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-candidate
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.identity.outputs.commit || steps.verify.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag || steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: verify
        name: Verify existing tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git cat-file -t "refs/tags/$EXPECTED_TAG")" = tag
          test "$(git rev-list -n 1 "$EXPECTED_TAG")" = "$EXPECTED_COMMIT"
          {
            echo "commit=$EXPECTED_COMMIT"
            echo "tag=$EXPECTED_TAG"
          } >> "$GITHUB_OUTPUT"
      - id: identity
        name: Create immutable candidate tag
        if: github.ref_type == 'branch'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_COMMIT"
          else
            git tag -a "$TAG" -m "$TAG" "$EXPECTED_COMMIT"
            git push origin "refs/tags/$TAG"
          fi
          {
            echo "commit=$EXPECTED_COMMIT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    needs:
      - verify
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .
      - name: Verify downloaded artifact
        shell: bash
        env:
          CHECKSUM: ${{ needs.verify.outputs.checksum }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(sha256sum "release-artifact/$TARBALL" | cut -d ' ' -f 1)" = "$CHECKSUM"
      - id: registry
        name: Check npm registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          LOCAL_INTEGRITY=$(node -e "const fs=require('fs'),c=require('crypto'); const h=c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'); process.stdout.write('sha512-'+h)" "release-artifact/$TARBALL")
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            test "$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity)" = "$LOCAL_INTEGRITY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with trusted provenance
        if: steps.registry.outputs.published == 'false'
        shell: bash
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: npm publish "./release-artifact/$TARBALL" --tag next --provenance --ignore-scripts --access public
      - name: Verify the published version is live on npm
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm view "$PACKAGE_NAME@$VERSION" version; then
              exit 0
            fi
            echo "npm registry read $attempt/12 did not resolve $PACKAGE_NAME@$VERSION"
            sleep 5
          done
          echo "::error::$PACKAGE_NAME@$VERSION did not become visible on npm"
          exit 1
      - name: Verify and repair the next dist-tag
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NEXT=$(npm view "$PACKAGE_NAME" dist-tags.next || true)
          if [ "$NEXT" != "$VERSION" ]; then
            npm dist-tag add "$PACKAGE_NAME@$VERSION" next
          fi
          test "$(npm view "$PACKAGE_NAME" dist-tags.next)" = "$VERSION"
          test "$(npm view "$PACKAGE_NAME" dist-tags.latest || true)" != "$VERSION"

  github-release:
    needs:
      - verify
      - tag
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .
      - name: Reconcile immutable GitHub Release
        shell: bash
        env:
          CHECKSUM: ${{ needs.verify.outputs.checksum }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_COMMIT"
          test "$(sha256sum "release-artifact/$TARBALL" | cut -d ' ' -f 1)" = "$CHECKSUM"
          {
            echo "## Release verification"
            echo
            echo '```json'
            cat release-assets/release-trust.json
            echo '```'
          } > release-notes.md
          if RELEASE_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            gh release edit "$TAG" \
              --verify-tag --prerelease --title "$TAG" --notes-file release-notes.md
            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TEMP_DIR"' EXIT
            MISSING_ASSETS=()
            for ASSET in "release-artifact/$TARBALL" release-assets/release-trust.json; do
              NAME=${ASSET##*/}
              if grep -Fxq "$NAME" <<<"$RELEASE_ASSETS"; then
                gh release download "$TAG" --pattern "$NAME" --dir "$TEMP_DIR"
                cmp -- "$ASSET" "$TEMP_DIR/$NAME"
              else
                MISSING_ASSETS+=("$ASSET")
              fi
            done
            if ((${#MISSING_ASSETS[@]} > 0)); then
              gh release upload "$TAG" "${MISSING_ASSETS[@]}"
            fi
          else
            gh release create "$TAG" \
              "release-artifact/$TARBALL#$TARBALL" \
              "release-assets/release-trust.json#release-trust.json" \
              --verify-tag --prerelease --title "$TAG" --notes-file release-notes.md
          fi
