name: Corpus Regression Guard

# Runs against small real OSS repos to catch false-positive regressions
# (Test Hardening Plan, P0 #1). Deliberately NOT on `pull_request` — it
# clones external repos and is slower/network-dependent than the main
# suite, so it runs nightly plus on-demand, not on every PR.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corpus-regression:
    runs-on: ubuntu-latest
    # 34 corpus repos (incl. the two committed §08 B/C fixture corpora)
    # shallow-cloned (or copied) and fully scanned each; large repos like
    # airflow and sentry scan close to the per-repo 60s budget. A hung
    # clone must not sit for the default 6 hours either way.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # The full corpus in one audit process parses very large TS
          # programs (sentry alone carries repo-scale bundles) — the
          # default ~4GB heap OOMs partway through the 34-repo run.
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm run corpus:regression
