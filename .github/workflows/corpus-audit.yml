name: Corpus Regression Guard

# Runs against small real OSS repos to catch false-positive regressions
# (Test Hardening Plan, P0 #1). Deliberately NOT on `pull_request` — it
# clones external repos and is slower/network-dependent than the main
# suite, so it runs nightly plus on-demand, not on every PR.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corpus-regression:
    runs-on: ubuntu-latest
    # 13 shallow clones + a full scan each; a hung clone must not sit for
    # the default 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run corpus:regression
