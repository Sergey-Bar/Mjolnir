# The version ladder.
#
# 6.0 replaced a 25-train program with five versions. The old program is in
# `docs/archive/ROADMAP-M26-M50.yaml` — text preserved, claims not — and this
# file is the whole of what the project has promised since.
#
# The change of shape is the point. Twenty-five trains with ~160 workstream
# ids, every owner UNASSIGNED and a status of `blocked-pending-live-ledger`,
# is a plan nobody could read or finish; a five-row table with one sentence and
# one kill criterion per row is a plan that can be abandoned at its own
# criterion without stranding the next version.
#
# Validated by `scripts/roadmap/validate.ts`; the archived program is NOT
# validated, because a record of claims nobody is keeping is not a contract.

schemaVersion: 2
program: "6.0-10.0"
status: "in-progress"

retiredProgram:
  id: "M26-M50"
  status: "RETIRED"
  retiredIn: "6.0.0"
  archive: "docs/archive/ROADMAP-M26-M50.yaml"
  deletedLedgers:
    - "docs/M26-GITHUB-SNAPSHOT.json"
    - "docs/M26-GAP-LEDGER.jsonl"
    - "docs/M26-SUPPORT-MATRIX.json"
    - "docs/M26-EXTERNAL-VALIDATION.json"
  why: >-
    The program tracked four ledgers that only the retired trains read, and the
    ledgers recorded BLOCKED cells and UNRECONCILED issues for evidence that was
    never going to arrive — external validation on a project with no external
    validator. Keeping the file kept four ledgers that had to be regenerated,
    re-checked and re-reviewed forever to say the same thing. Three ideas from
    it survive as gates on live code, not as rows: the Wilson interval floor
    (src/rules/tier-evidence.ts), the adversarial/boundary fixture quad
    (scripts/v6/check-fixture-quad.ts), and the external-evidence discipline,
    which becomes the 10.0 benchmark.

versions:
  - version: "6.0"
    status: "in-progress"
    theme: "Two words and one number"
    promise: >-
      A first run reads GATE / WARN and nothing else, and names the gate
      command.
    moves: >-
      npx to a gate recommendation in under 60 seconds, asserted by a
      frozen-clock contract test.
    killCriterion: >-
      If `npm run check` still needs more than 12 commands, 6.0 is not done —
      finish the cut. Do not start 7.0 on top of it. A command count is
      necessary and not sufficient: the tier system must also have a reachable
      top, or the cut only removed the words. Reaching it means one rule whose
      Wilson interval clears the 10% core ceiling at n >= 35 with zero observed
      false positives, adjudicated by a person, with its four-leg fixture quad
      complete. See ADR 0013 — the ceiling is decided at 10%, and 23 pending
      classifications stand between the corpus and the first core rule.

  - version: "7.0"
    status: "deferred"
    theme: "The gate proves itself"
    promise: >-
      The PR output is the change in trust, not the state.
    moves: >-
      Every gated PR proves it blocks; the demo repository blocks in one CI
      run.
    killCriterion: >-
      A third CI provider that needs more than ~80 new lines gets dropped, not
      built.

  - version: "8.0"
    status: "deferred"
    theme: "One notch wider"
    promise: >-
      Python/pytest and GitLab — measured, or not shipped.
    moves: >-
      Zero new default-scan rules without n >= 10 measured FP verdicts.
    killCriterion: >-
      A rule that cannot be measured inside the existing adjudication budget
      does not ship.

  - version: "9.0"
    status: "deferred"
    theme: "It ran"
    promise: >-
      Findings reach L3-L5 from a real run report, read from disk, parsed and
      discarded.
    moves: >-
      Share of GATE findings reaching L3+, measured on fixtures.
    killCriterion: >-
      Anything requiring persistence across runs is out.

  - version: "10.0"
    status: "deferred"
    theme: "Prove it on adversarial code"
    promise: >-
      A public, versioned, licensed false-green benchmark.
    moves: >-
      Every default-scan rule has a benchmark row with its measured FP rate.
    killCriterion: >-
      If it cannot be reproduced from a clean checkout without private data, it
      stays internal and 10.0 ships as a documentation-only release.
