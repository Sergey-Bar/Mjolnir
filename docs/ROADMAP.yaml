# The version ladder.
#
# 6.0 replaced a 25-train program with five versions. The old program is in
# `docs/archive/ROADMAP-M26-M50.yaml` — text preserved, claims not — and this
# file is the whole of what the project has promised since.
#
# The change of shape is the point. Twenty-five trains with ~160 workstream
# ids, every owner UNASSIGNED and a status of `blocked-pending-live-ledger`,
# is a plan nobody could read or finish; a five-row table with one sentence and
# one kill criterion per row is a plan that can be abandoned at its own
# criterion without stranding the next version.
#
# It is now a ONE-row table. Versions 7.0 through 10.0 were listed as
# `deferred`, which reads as a schedule: four dated rows, each with a theme, a
# promise and a kill criterion, and no owner and no date attached to any of them.
# Nobody promised them. They are retired below, with their surviving ideas
# recorded, so retiring the versions does not retire what they were for.
#
# Validated by `scripts/roadmap/validate.ts`; the archived programs are NOT
# validated, because a record of claims nobody is keeping is not a contract.

schemaVersion: 3
program: "6.0"
status: "in-progress"
currentRelease: "v6.0.0 — current stable"

retiredProgram:
  id: "M26-M50"
  status: "RETIRED"
  retiredIn: "6.0.0"
  archive: "docs/archive/ROADMAP-M26-M50.yaml"
  deletedLedgers:
    - "docs/M26-GITHUB-SNAPSHOT.json"
    - "docs/M26-GAP-LEDGER.jsonl"
    - "docs/M26-SUPPORT-MATRIX.json"
    - "docs/M26-EXTERNAL-VALIDATION.json"
  why: >-
    The program tracked four ledgers that only the retired trains read, and the
    ledgers recorded BLOCKED cells and UNRECONCILED issues for evidence that was
    never going to arrive — external validation on a project with no external
    validator. Keeping the file kept four ledgers that had to be regenerated,
    re-checked and re-reviewed forever to say the same thing. Three ideas from
    it survive as gates on live code, not as rows: the Wilson interval floor
    (src/rules/tier-evidence.ts), the adversarial/boundary fixture quad
    (scripts/v6/check-fixture-quad.ts), and the external-evidence discipline,
    which becomes the 10.0 benchmark.

versions:
  - version: "6.0"
    status: "in-progress"
    theme: "Two words and one number"
    promise: >-
      A first run reads GATE / WARN and nothing else, and names the gate
      command.
    moves: >-
      npx to a gate recommendation in under 60 seconds, asserted by a
      frozen-clock contract test.
    killCriterion: >-
      If `npm run check` still needs more than 12 commands, 6.0 is not done —
      finish the cut. Do not start 7.0 on top of it. A command count is
      necessary and not sufficient: the tier system must also have a reachable
      top, or the cut only removed the words. Reaching it means one rule whose
      Wilson interval clears the 10% core ceiling at n >= 35 with zero observed
      false positives, adjudicated by a person, with its four-leg fixture quad
      complete. See ADR 0013 — the ceiling is decided at 10%, and 23 pending
      classifications stood between the corpus and the first core rule.
    coreReachable: >-
      YES, as of 2026-10-03 — QA-PW-117: n=35, zero observed false positives,
      Wilson upper bound 9.89% against the 10% ceiling, all four fixture legs
      present. The 23 pending classifications were adjudicated and four of them
      were orphans — rows citing a line one above the annotation, which would
      have counted one annotation twice — so the pass funded 19 rows, a
      corpus-wide sweep found one more, and the ceiling took the last of them.
      QA-JV-101 earned the tier the same day by the same route, and the census
      now counts 2 core rules; see `docs/MEASUREMENT-CLOSEOUT.md` for the
      generated figure, which is the one to trust over this prose.
      See ADR 0014 for the floor that gives the tier teeth, and CHANGELOG.md for
      the ANTI-CREEP-EXCEPTION Law 1 required for the first addition to a launch
      set that held nothing to remove.

# ---------------------------------------------------------------------------
# Retired: the 7.0-10.0 ladder.
#
# These four rows were not promises. They carried no owner and no date, and
# "deferred" reads as a schedule rather than as an absence. A reader sees four
# themes, four promises and four kill criteria and concludes there is a plan.
#
# The THEMES were good, and retiring the rows is not a verdict on them — three
# of the four are live work already, tracked where they can actually be closed.
# What was retired is the claim that they were scheduled releases. Each entry
# says where its thinking went, following the precedent the M26 retirement set:
# preserve the text, retire the version.
# ---------------------------------------------------------------------------
retiredPrograms:
  - program: "7.0-10.0 version ladder"
    status: "RETIRED"
    retiredOn: "2026-10-04"
    archive: "docs/archive/ROADMAP-M26-M50.yaml"
    reason: >-
      Four `deferred` rows with no owner and no date read as a schedule. Nothing
      committed to them and nothing should be reported as committed on their
      behalf.
    deletedLedgers:
      - "four version rows (7.0, 8.0, 9.0, 10.0), each with theme, promise, moves and killCriterion"
      - "the `program: 6.0-10.0` span, which described a ladder four versions longer than the one in flight"
    survivingIdeas:
      - >-
        7.0's "the PR output is the change in trust, not the state" — SHIPPED
        inside 6.0, not deferred. `mjolnir ci verify` reports RESOLVED / NEW
        against `.mjolnir/baseline.json`, and the Quickstart now documents it.
      - >-
        8.0's "Python/pytest and GitLab — measured, or not shipped" — LIVE as
        the evidence-ladder work in `src/discovery/evidence-discovery.ts`, where
        `EVIDENCE_CONVENTIONS` is the four-entry gate that decides which run
        reports a rule may read. Unmeasured ecosystems are withheld rather than
        guessed at.
      - >-
        9.0's "share of GATE findings reaching L3+" — LIVE in
        `src/engine/runtime-corroboration.ts` and `src/forensics/run.ts`, with
        the metric recorded in docs/ROADMAP.yaml's own `northStar`. The
        capability exists; publishing the figure is not done, and is named as
        such rather than claimed.
      - >-
        10.0's public false-green benchmark — NOT STARTED and not scheduled. It
        needs a licensing decision and a clean-checkout reproduction, both of
        which are the owner's to make.
