name: QA Check
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run Mjölnir scan
        run: npx mjolnir scan

      - name: Report result
        if: success()
        run: echo "Quality gate: PASSED"
