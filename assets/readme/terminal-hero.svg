<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="666" viewBox="0 0 820 666" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5">
  <defs>
    <clipPath id="winClip">
      <rect x="0" y="0" width="820" height="666" rx="14" ry="14"/>
    </clipPath>
    <linearGradient id="titlebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d18"/>
      <stop offset="1" stop-color="#0e1512"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.4" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#winClip)">
    <rect x="0" y="0" width="820" height="666" fill="#070b09"/>

    <rect x="0" y="0" width="820" height="42" fill="url(#titlebarGrad)"/>
    <line x1="0" y1="42" x2="820" y2="42" stroke="#39FF14" stroke-opacity="0.14"/>
    <circle cx="24" cy="21" r="6.5" fill="#ff5f56"/>
    <circle cx="46" cy="21" r="6.5" fill="#ffbd2e"/>
    <circle cx="68" cy="21" r="6.5" fill="#27c93f"/>
    <text x="410" y="25.5" fill="#5C7A68" font-size="12.5" text-anchor="middle" letter-spacing="0.5">user@ci: ~/repo &#8212; qa-doctor scan</text>

    <g filter="url(#glow)">
      <text x="30" y="82.5" xml:space="preserve"><tspan fill="#3CFF57">$ </tspan><tspan fill="#EAFFF1">npx qa-doctor@latest</tspan></text>
    <text x="30" y="126.5" xml:space="preserve"><tspan fill="#1B7A40">SCORE  </tspan><tspan fill="#EAFFF1">72/100</tspan><tspan fill="#FFC94D">  NEEDS WORK</tspan></text>
    <text x="30" y="148.5" xml:space="preserve"><tspan fill="#3CFF57">██████████████████████▓</tspan><tspan fill="#155C31">░░░░░░░░</tspan></text>
    <text x="30" y="192.5" xml:space="preserve"><tspan fill="#22B85B">DETECTED </tspan><tspan fill="#2FE070">[vitest] [playwright]</tspan></text>
    <text x="30" y="236.5" xml:space="preserve"><tspan fill="#7CFFC4">» DIAGNOSTICS BY CATEGORY</tspan></text>
    <text x="30" y="258.5" xml:space="preserve"><tspan fill="#22B85B">QA-TEST   </tspan><tspan fill="#3CFF57">████████████████</tspan><tspan fill="#155C31">░░</tspan><tspan fill="#EAFFF1">  92</tspan></text>
    <text x="30" y="280.5" xml:space="preserve"><tspan fill="#22B85B">QA-CI     </tspan><tspan fill="#FFC94D">██████████</tspan><tspan fill="#155C31">░░░░░░░░░░</tspan><tspan fill="#EAFFF1">  61</tspan></text>
    <text x="30" y="324.5" xml:space="preserve"><tspan fill="#7CFFC4">» WHERE POINTS WERE LOST</tspan></text>
    <text x="30" y="346.5" xml:space="preserve"><tspan fill="#FF6B6B">  3 × error    −24</tspan></text>
    <text x="30" y="368.5" xml:space="preserve"><tspan fill="#FFC94D">  11 × warning −33</tspan></text>
    <text x="30" y="412.5" xml:space="preserve"><tspan fill="#7CFFC4">» TOP ISSUES</tspan></text>
    <text x="30" y="456.5" xml:space="preserve"><tspan fill="#FF6B6B">✗ ERROR   </tspan><tspan fill="#FFB3B3">Job &quot;security-scan&quot; has continue-on-error: true.</tspan></text>
    <text x="30" y="478.5" xml:space="preserve"><tspan fill="#B33F3F">          QA-CI-001 · .github/workflows/ci.yml:12</tspan></text>
    <text x="30" y="500.5" xml:space="preserve"><tspan fill="#B33F3F">          FALSE-GREEN — this job can fail every day and CI stays green.</tspan></text>
    <text x="30" y="544.5" xml:space="preserve"><tspan fill="#FFC94D">⚠ WARN    </tspan><tspan fill="#FFE1A8">Hard sleep: page.waitForTimeout(3000).</tspan></text>
    <text x="30" y="566.5" xml:space="preserve"><tspan fill="#B8862E">          QA-TEST-004 · e2e/checkout.spec.ts:88</tspan></text>
    <text x="30" y="588.5" xml:space="preserve"><tspan fill="#B8862E">          FLAKY-RISK — guesses at timing instead of waiting for state.</tspan></text>
    <text x="30" y="632.5" xml:space="preserve"><tspan fill="#3CFF57">$ </tspan><tspan fill="#3CFF57" opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>▌</tspan></text>
    
    </g>

    <rect x="0" y="42" width="820" height="624" fill="url(#scanlines)"/>
    <rect x="0" y="0" width="820" height="666" fill="url(#vignette)"/>
  </g>

  <rect x="0.6" y="0.6" width="818.8" height="664.8" rx="13.5" ry="13.5" fill="none" stroke="#39FF14" stroke-opacity="0.28" stroke-width="1.2"/>
</svg>
