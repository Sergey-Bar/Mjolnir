# Marketplace-grade composite action (product-gap-remediation master
# plan P1.1, plan .kilo/plans/1788853205786). Lives at the repo ROOT
# because GitHub Actions Marketplace requires it there — a conscious,
# documented amendment to the repo's root contract
# (tests/contract/repo-hygiene.spec.ts), never a silent one.
#
# Consumers pin a major tag (`uses: Sergey-Bar/Mjolnir@v1`); the separate
# action-tags workflow moves that tag only after a stable, non-RC release.
# Scanning runs through the published npm package (`npx mjolnir-qa@…`),
# never an `npm ci` of this repo — the action must work for consumers,
# not contributors.
#
# SARIF upload: the optional `upload-sarif` input (default true) wires
# `github/codeql-action/upload-sarif` after the scan, so findings land in
# the Security tab. It requires `permissions: security-events: write` —
# consumers grant that in their own workflow; a composite action cannot
# escalate its caller's permissions by design.
#
# Event-data safety (audit S-5, the repo's own QA-CI rule): every input
# reaches the shell through `env:`, never by interpolation into a `run:`
# body.
name: "Mjölnir — verification trust scan"
description: >-
  Scan your test suites, Playwright configs, and CI workflows for tests
  that cannot fail and pipelines that cannot go red. Produces a trust
  score with evidence for every point. SARIF output for GitHub Code
  Scanning. PR comments with actionable findings. Measured
  false-positive rates per rule.

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  scope:
    description: "'all' (default) or 'changed' — only what this branch touched"
    required: false
    default: "all"
  strict:
    description: "Include quarantine-tier rules in the scan (--strict)"
    required: false
    default: "false"
  format:
    description: "Output format: terminal, json, sarif, codequality, or mermaid"
    required: false
    default: "terminal"
  fail-on:
    description: >-
      Exit-status gate: error (default, block on error findings), warning
      (block on warnings and errors), or none (advisory)
    required: false
    default: "error"
  node-version:
    description: "Node.js version to run the scan with"
    required: false
    default: "22.18"
  version:
    description: >-
      Exact mjolnir-qa npm version to run. Defaults to the current released
      package version; override only with another exact version.
    required: false
    default: "2.0.2"
  upload-sarif:
    description: >-
      Upload SARIF to GitHub Code Scanning (requires security-events:
      write permission). Ignored unless format is sarif.
    required: false
    default: "true"
  annotations:
    description: >-
      Emit the scan's findings as GitHub annotations plus a step summary
      (from the saved --json report). Runs a lightweight JSON capture
      scan when the primary format is not json.
    required: false
    default: "true"
  pr-comment:
    description: >-
      Post/update the Trust Report as a PR comment (pull_request events
      only; one comment per PR — upserted by marker). Requires the
      job to grant contents: read and pull-requests: write. Runs a
      lightweight JSON capture scan when the primary format is not json.
    required: false
    default: "true"
  trust-artifact:
    description: >-
      Opt-in upload of the generated unified PR report and raw JSON. Raw JSON
      may contain source paths and should not be uploaded by default.
    required: false
    default: "false"
  fail-on-partial:
    description: >-
      Fail the job when the scan is partial (exit 2). Default: false
      (partial scans produce a warning, not a failure). Set to true only
      when a complete scan is required.
    required: false
    default: "false"

outputs:
  exit-code:
    description: "The scan's exit code (0 clean · 1 findings at gate · 2 partial)"
    value: ${{ steps.scan.outputs.exit }}
  findings:
    description: "Finding count from the JSON report (format: json only, else empty)"
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: "Path of the SARIF report when format is sarif, else empty"
    value: ${{ steps.scan.outputs.sarif-file }}
  trust-report-file:
    description: "Path of the generated unified PR report (mjolnir-comment.md)"
    value: ${{ steps.pr-report.outputs.file }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Validate inputs
      shell: bash
      env:
        MJ_SCOPE: ${{ inputs.scope }}
        MJ_FAIL_ON: ${{ inputs.fail-on }}
        MJ_FORMAT: ${{ inputs.format }}
        MJ_STRICT: ${{ inputs.strict }}
        MJ_ANNOTATIONS: ${{ inputs.annotations }}
        MJ_PR_COMMENT: ${{ inputs.pr-comment }}
        MJ_TRUST_ARTIFACT: ${{ inputs.trust-artifact }}
        MJ_FAIL_ON_PARTIAL: ${{ inputs.fail-on-partial }}
        MJ_VERSION: ${{ inputs.version }}
      run: |
        case "$MJ_SCOPE" in
          all|changed) ;;
          *) echo "::error::scope must be 'all' or 'changed', got '$MJ_SCOPE'"; exit 10 ;;
        esac
        case "$MJ_FAIL_ON" in
          error|warning|none) ;;
          *) echo "::error::fail-on must be 'error', 'warning' or 'none', got '$MJ_FAIL_ON'"; exit 10 ;;
        esac
        case "$MJ_FORMAT" in
          terminal|json|sarif|codequality|mermaid) ;;
          *) echo "::error::format must be 'terminal', 'json', 'sarif', 'codequality' or 'mermaid', got '$MJ_FORMAT'"; exit 10 ;;
        esac
        case "$MJ_STRICT" in
          true|false) ;;
          *) echo "::error::strict must be 'true' or 'false', got '$MJ_STRICT'"; exit 10 ;;
        esac
        case "$MJ_ANNOTATIONS" in
          true|false) ;;
          *) echo "::error::annotations must be 'true' or 'false', got '$MJ_ANNOTATIONS'"; exit 10 ;;
        esac
        case "$MJ_PR_COMMENT" in
          true|false) ;;
          *) echo "::error::pr-comment must be 'true' or 'false', got '$MJ_PR_COMMENT'"; exit 10 ;;
        esac
        case "$MJ_TRUST_ARTIFACT" in
          true|false) ;;
          *) echo "::error::trust-artifact must be 'true' or 'false', got '$MJ_TRUST_ARTIFACT'"; exit 10 ;;
        esac
        case "$MJ_FAIL_ON_PARTIAL" in
          true|false) ;;
          *) echo "::error::fail-on-partial must be 'true' or 'false', got '$MJ_FAIL_ON_PARTIAL'"; exit 10 ;;
        esac
        if ! [[ "$MJ_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::version must be an exact semantic version, got '$MJ_VERSION'"
          exit 10
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        MJ_PATH: ${{ inputs.path }}
        MJ_SCOPE: ${{ inputs.scope }}
        MJ_STRICT: ${{ inputs.strict }}
        MJ_FORMAT: ${{ inputs.format }}
        MJ_FAIL_ON: ${{ inputs.fail-on }}
        MJ_FAIL_ON_PARTIAL: ${{ inputs.fail-on-partial }}
        MJ_VERSION: ${{ inputs.version }}
      run: |
        ARGS=("$MJ_PATH")
        if [ "$MJ_SCOPE" = "changed" ]; then ARGS+=(--scope changed); fi
        if [ "$MJ_STRICT" = "true" ]; then ARGS+=(--strict); fi
        case "$MJ_FORMAT" in
          json)         ARGS+=(--json) ;;
          sarif)        ARGS+=(--format sarif) ;;
          codequality)  ARGS+=(--format codequality) ;;
          mermaid)      ARGS+=(--format mermaid) ;;
        esac
        case "$MJ_FAIL_ON" in
          error)   ARGS+=(--blocking error) ;;
          warning) ARGS+=(--blocking warning) ;;
          none)    ARGS+=(--blocking none) ;;
        esac
        MJ_PACKAGE="https://registry.npmjs.org/mjolnir-qa/-/mjolnir-qa-${MJ_VERSION}.tgz"
        echo "Running: npx --yes ${MJ_PACKAGE} ${ARGS[*]}"
        set +e
        if [ "$MJ_FORMAT" = "json" ]; then
          npx --yes "$MJ_PACKAGE" "${ARGS[@]}" > mjolnir.json
        elif [ "$MJ_FORMAT" = "sarif" ]; then
          npx --yes "$MJ_PACKAGE" "${ARGS[@]}" > mjolnir-report.sarif
        elif [ "$MJ_FORMAT" = "codequality" ]; then
          npx --yes "$MJ_PACKAGE" "${ARGS[@]}" > mjolnir-codequality.json
        elif [ "$MJ_FORMAT" = "mermaid" ]; then
          npx --yes "$MJ_PACKAGE" "${ARGS[@]}" > mjolnir-report.mmd
        else
          npx --yes "$MJ_PACKAGE" "${ARGS[@]}"
        fi
        EXIT=$?
        set -e
        echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
        # Exit-code contract: 2 = partial scan. By default, partial scans
        # produce a warning and never block. An explicit true opt-in makes
        # a complete scan mandatory. Exit 1 (findings at gate) and 10/20
        # (usage/internal) follow the selected finding gate.
        if [ "$EXIT" = "2" ]; then
          echo "::warning::Mjölnir scan was PARTIAL — some files were not analyzed; the gate is not enforced."
          if [ "$MJ_FAIL_ON_PARTIAL" = "true" ]; then
            echo "::error::fail-on-partial is enabled — failing the job on partial scan"
            exit 2
          fi
          exit 0
        fi
        if [ "$MJ_FORMAT" = "sarif" ]; then
          echo "sarif-file=mjolnir-report.sarif" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-file=" >> "$GITHUB_OUTPUT"
        fi
        if [ "$MJ_FORMAT" = "json" ] && [ -s mjolnir.json ]; then
          node -e '
            const fs = require("fs");
            try {
              const r = JSON.parse(fs.readFileSync("mjolnir.json", "utf8"));
              const findings = Array.isArray(r.findings) ? r.findings.length : 0;
              fs.appendFileSync(process.env.GITHUB_OUTPUT,
                "findings=" + findings + "\n");
            } catch { fs.appendFileSync(process.env.GITHUB_OUTPUT, "findings=\n"); }
          '
        else
          echo "findings=" >> "$GITHUB_OUTPUT"
        fi
        # Propagate the gate result (exit 2 partial already downgraded).
        exit "$EXIT"

    - name: Upload SARIF to GitHub Code Scanning
      if: >-
        inputs.format == 'sarif' && inputs.upload-sarif == 'true' &&
        steps.scan.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}

    # ── Trust Report consumption (WI-9, plan §13) ──────────────────────
    # Zero trust semantics HERE: every number below is rendered by the
    # published CLI from a saved canonical --json report (`trust-report
    # --from`). The action only moves bytes. The capture scan uses
    # --blocking none so reporting can never change the gate result.

    - name: Capture JSON report for reporting
      if: >-
        (inputs.annotations == 'true' || inputs.pr-comment == 'true' ||
        inputs.trust-artifact == 'true') && inputs.format != 'json'
      id: capture
      shell: bash
      env:
        MJ_PATH: ${{ inputs.path }}
        MJ_SCOPE: ${{ inputs.scope }}
        MJ_STRICT: ${{ inputs.strict }}
        MJ_VERSION: ${{ inputs.version }}
      run: |
        ARGS=("$MJ_PATH" --json --blocking none)
        if [ "$MJ_SCOPE" = "changed" ]; then ARGS+=(--scope changed); fi
        if [ "$MJ_STRICT" = "true" ]; then ARGS+=(--strict); fi
        set +e
        MJ_PACKAGE="https://registry.npmjs.org/mjolnir-qa/-/mjolnir-qa-${MJ_VERSION}.tgz"
        npx --yes "$MJ_PACKAGE" "${ARGS[@]}" > mjolnir.json
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Generate unified PR report
      id: pr-report
      if: >-
        (inputs.annotations == 'true' || inputs.pr-comment == 'true' ||
        inputs.trust-artifact == 'true')
      shell: bash
      env:
        MJ_VERSION: ${{ inputs.version }}
      run: |
        MJ_PACKAGE="https://registry.npmjs.org/mjolnir-qa/-/mjolnir-qa-${MJ_VERSION}.tgz"
        npx --yes "$MJ_PACKAGE" pr-comment --from mjolnir.json --version "$MJ_VERSION" > mjolnir-comment.md
        echo "file=mjolnir-comment.md" >> "$GITHUB_OUTPUT"

    - name: Emit annotations + step summary
      if: inputs.annotations == 'true'
      shell: bash
      env:
        MJ_VERSION: ${{ inputs.version }}
      run: |
        # summary streams findings as GitHub annotations to stdout (when
        # GITHUB_ACTIONS=true) and the step summary to
        # $GITHUB_STEP_SUMMARY — the CLI's own CI surface, zero action-
        # side rendering logic.
        MJ_PACKAGE="https://registry.npmjs.org/mjolnir-qa/-/mjolnir-qa-${MJ_VERSION}.tgz"
        npx --yes "$MJ_PACKAGE" summary mjolnir.json --stdout | tee "${GITHUB_STEP_SUMMARY:-/dev/null}"

    - name: Post unified report as PR comment
      if: >-
        inputs.pr-comment == 'true' &&
        github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MJ_PR_NUMBER: ${{ github.event.pull_request.number }}
        MJ_REPO: ${{ github.repository }}
      run: |
        BODY_FILE="mjolnir-comment.md"
        if [ ! -s "$BODY_FILE" ]; then
          echo "::warning::Unified report body missing — skipping PR comment"
          exit 0
        fi
        MARKER='<!-- mjolnir-report:v2 -->'
        COMMENT_ID="$(gh api "repos/${MJ_REPO}/issues/${MJ_PR_NUMBER}/comments" \
          --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)"
        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH "repos/${MJ_REPO}/issues/comments/${COMMENT_ID}" \
            -F body="@${BODY_FILE}" >/dev/null
          echo "Updated unified report comment ${COMMENT_ID}"
        else
          gh api --method POST "repos/${MJ_REPO}/issues/${MJ_PR_NUMBER}/comments" \
            -F body="@${BODY_FILE}" >/dev/null
          echo "Posted unified report comment"
        fi

    - name: Upload unified report artifacts
      if: inputs.trust-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mjolnir-report
        path: |
          mjolnir-comment.md
          mjolnir.json
        if-no-files-found: warn
        retention-days: 30
